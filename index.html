<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的小窝">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='#f8d7da'/><text x='90' y='110' font-size='80' text-anchor='middle'>🏠</text></svg>">
  <title>我的小窝</title>
  <style>
    /* ========== 全局样式 ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      background: #f5efe0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
    }
    .app-frame {
      width: 100%;
      max-width: 420px;
      height: 85vh;
      max-height: 750px;
      background: #fffef7;
      border-radius: 40px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 3px solid #e6d7b8;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      flex-shrink: 0;
    }
    .top-bar h2 {
      font-size: 1.3rem;
      color: #5a4530;
      letter-spacing: 1px;
    }
    .mode-toggle {
      background: #f0e5d3;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      color: #5a4530;
    }

    /* 页面容器 */
    .page-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
    }

    /* J人模式 */
    .j-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .j-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fdf9f2;
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      border: 2px solid #ece0c8;
    }
    .j-item:active { background: #f5ebd5; }
    .j-icon { font-size: 2rem; width: 48px; text-align: center; }
    .j-info { flex: 1; }
    .j-name { font-weight: bold; color: #4a3724; font-size: 1.1rem; }
    .j-desc { font-size: 0.75rem; color: #9b896c; margin-top: 2px; }
    .j-arrow { color: #c4a87c; font-size: 1.2rem; }

    /* P人模式 */
    .p-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      padding: 10px 0;
    }
    .p-bubble {
      background: #fdf9f2;
      border-radius: 28px;
      padding: 20px 16px;
      cursor: pointer;
      border: 2px solid #ece0c8;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .p-bubble:active { background: #f5ebd5; transform: scale(0.96); }
    .p-bubble.size-lg { width: 140px; height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
    .p-bubble.size-md { width: 110px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .p-bubble.size-sm { width: 90px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .p-icon { font-size: 2rem; }
    .p-name { font-weight: bold; font-size: 0.85rem; color: #4a3724; }

    /* 功能页面 */
    .func-page {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .func-page.active {
      display: flex;
    }
    .func-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      flex-shrink: 0;
    }
    .back-btn {
      background: #f0e5d3;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .func-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 8px;
    }

    /* ========== 周期手账样式 ========== */
    .app-card {
      width: 100%;
      background: #fffef7;
      border-radius: 30px;
      padding: 16px 10px 18px;
      border: 2px solid #e6d7b8;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }
    .app-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,245,0.8);
      border-radius: 28px;
      z-index: 0;
      pointer-events: none;
    }
    .app-card > * { position: relative; z-index: 1; }
    .app-card h2 {
      text-align: center;
      color: #5a4530;
      font-size: 1.3rem;
      letter-spacing: 2px;
    }
    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #5a4530;
    }
    .month-nav {
      background: #f3e5d0;
      border: none;
      font-size: 1.2rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .day-header {
      font-size: 0.65rem;
      color: #9b896c;
      font-weight: bold;
      padding: 3px 0;
    }
    .day-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      background: #fcf9f2;
      cursor: pointer;
      border: 2px solid transparent;
      font-weight: bold;
      color: #5a4a30;
      position: relative;
    }
    .day-cell.period { background: #f8d7da; border-color: #e8a0a8; color: #6b2e38; }
    .day-cell.predicted { background: #f0e6f6; border: 2px dashed #c4a4d4; color: #4a3060; }
    .day-cell.fertile { background: #e0f4f0; border-color: #a0d8c8; color: #2e5a4a; }
    .day-cell.ovulation { background: #c8f0e4; border-color: #80c8b0; color: #1e4a3a; }
    .day-cell.luteal { background: #fef9e7; border-color: #e8d5a0; color: #6b5a2e; }
    .day-cell.intimacy-only { background: #fde4d0; border-color: #f0b890; color: #6b3e2e; }
    .day-cell.today { border: 3px solid #d4a373; }
    .mini-dot { width: 4px; height: 4px; background: #e87d8b; border-radius: 50%; margin-top: 1px; }
    .mini-img { width: 14px; height: 14px; border-radius: 3px; background-size: cover; background-position: center; margin-top: 1px; }
    .ovu-icon { font-size: 0.5rem; position: absolute; top: 1px; right: 1px; }
    .legend {
      display: flex;
      gap: 4px;
      font-size: 0.55rem;
      color: #7a6b54;
      flex-wrap: wrap;
      justify-content: center;
    }
    .legend span { display: flex; align-items: center; gap: 1px; }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .hint-text { font-size: 0.65rem; color: #8b6e5e; text-align: center; min-height: 14px; }

    /* 弹窗共用 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fffef7;
      border-radius: 22px;
      padding: 18px 14px;
      width: 85%;
      max-width: 340px;
      border: 3px solid #e6d7b8;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 75vh;
      overflow-y: auto;
    }
    .modal-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .modal-emoji {
      font-size: 1.6rem;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 10px;
      border: 2px solid transparent;
    }
    .modal-emoji.selected { background: #ffe3a5; border-color: #f0c060; }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 0;
    }
    .toggle-track {
      width: 42px;
      height: 24px;
      background: #ccc;
      border-radius: 12px;
      position: relative;
      flex-shrink: 0;
    }
    .toggle-track.on { background: #e8a0a8; }
    .toggle-thumb {
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.2s;
    }
    .toggle-track.on .toggle-thumb { left: 20px; }
    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete { background: #e8b4b4; color: #5a2020; }
    .btn-close { background: #eee; color: #444; }
    .intimacy-tag {
      background: #f0e0d0;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .intimacy-tag.selected { background: #e8c8b8; border-color: #c47a6b; }
    .image-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      flex-direction: column;
      gap: 12px;
    }
    .image-modal.show { display: flex; }
    .image-modal img { max-width: 90%; max-height: 75%; border-radius: 14px; border: 4px solid white; }
    .image-modal .close-img-btn { background: white; border: none; padding: 8px 22px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    /* ========== 菜谱选购样式 ========== */
    .recipe-container {
      width: 100%;
      background: #fffef9;
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 2px solid #ece0c8;
    }
    .recipe-header {
      padding: 16px 14px 10px;
      text-align: center;
      border-bottom: 1px solid #f0e5d2;
      flex-shrink: 0;
    }
    .recipe-header h1 { font-size: 1.3rem; color: #5a4630; }
    .recipe-main { display: flex; flex: 1; overflow: hidden; }
    .category-sidebar {
      width: 60px;
      background: #faf6ed;
      border-right: 1px solid #ece0c8;
      overflow-y: auto;
      padding: 6px 0;
      flex-shrink: 0;
    }
    .category-item {
      text-align: center;
      padding: 10px 2px;
      cursor: pointer;
      font-size: 0.7rem;
      color: #6b5d4c;
      border-radius: 10px;
      margin: 0 4px;
      font-weight: bold;
    }
    .category-item.active { background: #e8d9c0; color: #4a3620; }
    .dish-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dish-card {
      display: flex;
      gap: 8px;
      background: #fffdf7;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      border: 1px solid #f2e8d5;
      align-items: center;
    }
    .dish-img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      background-color: #f0e5d3;
      flex-shrink: 0;
    }
    .dish-info { flex: 1; min-width: 0; }
    .dish-name { font-weight: bold; font-size: 0.9rem; color: #4a3724; margin-bottom: 2px; }
    .dish-ingredients { font-size: 0.65rem; color: #8b7a64; display: flex; flex-wrap: wrap; gap: 2px; }
    .ingredient-tag { background: #f5ede1; padding: 1px 6px; border-radius: 8px; font-size: 0.6rem; }
    .add-btn {
      background: #d9b382;
      border: none;
      color: white;
      font-size: 1rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #b3925c;
    }
    .add-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d623c; }
    .recipe-bottom-bar {
      background: #fffef7;
      border-top: 2px solid #ecdbba;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .cart-info { font-weight: bold; color: #5a4630; font-size: 0.8rem; }
    .view-list-btn {
      background: #d9b382;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .add-dish-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: #d9b382;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 4px 0 #b3925c;
    }
    .add-dish-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7d623c; }
    .receipt-modal {
      background: #fffef7;
      border-radius: 24px;
      padding: 20px 14px;
      width: 85%;
      max-width: 340px;
      max-height: 60vh;
      overflow-y: auto;
      border: 3px solid #e6d7b8;
    }
    .receipt-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed #e0cfaf;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .receipt-item.checked { text-decoration: line-through; color: #b0a090; }
    .check-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid #c4a87c;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .receipt-item.checked .check-box { background: #b3925c; border-color: #b3925c; }
    .receipt-item.checked .check-box::after { content: '✓'; color: white; font-weight: bold; font-size: 0.7rem; }
    .close-receipt {
      background: #eee;
      border: none;
      padding: 8px 18px;
      border-radius: 16px;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    .edit-modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .edit-modal.show { display: flex; }
    .edit-box {
      background: #fffef7;
      border-radius: 22px;
      padding: 18px 14px;
      width: 90%;
      max-width: 360px;
      border: 3px solid #e6d7b8;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 70vh;
      overflow-y: auto;
    }
    .edit-box input, .edit-box textarea, .edit-box select {
      width: 100%;
      padding: 8px;
      border-radius: 12px;
      border: 2px solid #e3cd9e;
      font-size: 0.85rem;
      background: #fffcf2;
      outline: none;
    }
    .edit-box .row { display: flex; gap: 6px; align-items: center; }
    .btn-primary { background: #b3925c; color: white; }
    .btn-danger { background: #e8b4b4; color: #5a2020; }
    .btn-neutral { background: #eee; }
  </style>
</head>
<body>
<div class="app-frame">
  <div class="top-bar" id="topBar">
    <h2 id="topTitle">🏠 我的小窝</h2>
    <button class="mode-toggle" id="modeToggle">🔄 J人模式</button>
  </div>

  <div class="page-area" id="homePage">
    <div class="j-list" id="jListView"></div>
    <div class="p-grid" id="pGridView" style="display:none;"></div>
  </div>

  <!-- 周期手账页 -->
  <div class="func-page" id="funcPeriod">
    <div class="func-header">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <span style="font-weight:bold;">🌸 周期手账</span>
    </div>
    <div class="func-content" id="periodContent"></div>
  </div>

  <!-- 菜谱选购页 -->
  <div class="func-page" id="funcRecipe">
    <div class="func-header">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <span style="font-weight:bold;">🍳 菜谱选购</span>
    </div>
    <div class="func-content" id="recipeContent"></div>
  </div>
</div>

<script>
// ==================== 主框架逻辑 ====================
const modules = [
  { id: 'period', name: '周期手账', icon: '🌸', desc: '经期记录、排卵预测', size: 'lg' },
  { id: 'recipe', name: '菜谱选购', icon: '🍳', desc: '选菜、生成采购清单', size: 'lg' },
  { id: 'mood', name: '心情日记', icon: '📓', desc: '每天记录心情', size: 'md' },
  { id: 'notes', name: '便签', icon: '📝', desc: '随手记灵感', size: 'sm' },
  { id: 'more', name: '更多', icon: '📦', desc: '即将上线', size: 'sm' }
];

let isJMode = true;

function renderJList() {
  document.getElementById('jListView').innerHTML = modules.map(m => `
    <div class="j-item" onclick="openModule('${m.id}')">
      <div class="j-icon">${m.icon}</div>
      <div class="j-info"><div class="j-name">${m.name}</div><div class="j-desc">${m.desc}</div></div>
      <div class="j-arrow">›</div>
    </div>`).join('');
}

function renderPGrid() {
  document.getElementById('pGridView').innerHTML = modules.map(m => `
    <div class="p-bubble size-${m.size}" onclick="openModule('${m.id}')">
      <div class="p-icon">${m.icon}</div><div class="p-name">${m.name}</div>
    </div>`).join('');
}

document.getElementById('modeToggle').addEventListener('click', function() {
  isJMode = !isJMode;
  this.textContent = isJMode ? '🔄 J人模式' : '🔄 P人模式';
  document.getElementById('jListView').style.display = isJMode ? 'flex' : 'none';
  document.getElementById('pGridView').style.display = isJMode ? 'none' : 'flex';
});

function openModule(id) {
  document.getElementById('homePage').style.display = 'none';
  document.getElementById('topBar').style.display = 'none';
  if (id === 'period') {
    document.getElementById('funcPeriod').classList.add('active');
    if (!window._periodLoaded) { loadPeriodModule(); window._periodLoaded = true; }
  } else if (id === 'recipe') {
    document.getElementById('funcRecipe').classList.add('active');
    if (!window._recipeLoaded) { loadRecipeModule(); window._recipeLoaded = true; }
  } else {
    alert('这个功能还在开发中~');
    goHome();
  }
}

function goHome() {
  document.getElementById('homePage').style.display = 'block';
  document.getElementById('topBar').style.display = 'flex';
  document.querySelectorAll('.func-page').forEach(p => p.classList.remove('active'));
}

// ==================== 周期手账模块 ====================
function loadPeriodModule() {
  document.getElementById('periodContent').innerHTML = `
    <div class="app-card" id="appCard">
      <h2>🌸 周期手账</h2>
      <div style="display:flex;justify-content:center;gap:6px;">
        <button id="changeBgBtn" style="background:#f0e5d3;border:none;padding:6px 12px;border-radius:16px;font-size:0.7rem;font-weight:bold;cursor:pointer;">🖼 换背景</button>
        <button id="resetBgBtn" style="background:#f0e5d3;border:none;padding:6px 12px;border-radius:16px;font-size:0.7rem;font-weight:bold;cursor:pointer;">↩ 恢复</button>
        <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
      </div>
      <div class="month-header">
        <button class="month-nav" id="prevMonth">◀</button>
        <span id="monthLabel"></span>
        <button class="month-nav" id="nextMonth">▶</button>
      </div>
      <div class="calendar-grid" id="calendarHead"></div>
      <div class="calendar-grid" id="calendarBody"></div>
      <div class="legend">
        <span><span class="legend-dot" style="background:#f8d7da;"></span>经期</span>
        <span><span class="legend-dot" style="background:#f0e6f6; border:1px dashed #c4a4d4;"></span>预测</span>
        <span><span class="legend-dot" style="background:#e0f4f0;"></span>排卵期</span>
        <span><span class="legend-dot" style="background:#c8f0e4;"></span>排卵日</span>
        <span><span class="legend-dot" style="background:#fef9e7;"></span>黄体期</span>
        <span><span class="legend-dot" style="background:#fde4d0;"></span>亲密</span>
      </div>
      <div class="hint-text" id="cycleHint"></div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <strong id="modalDateTitle"></strong>
        <div class="toggle-row" id="periodToggle"><span>🩸 标记为经期</span><div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div></div>
        <div class="hint-text" id="periodHint"></div>
        <div class="modal-row"><span>😣 肚子：</span><span id="painEmojis"></span></div>
        <div class="modal-row"><span>🩸 血量：</span><span id="flowEmojis"></span></div>
        <div class="modal-row"><span>💕 亲密：</span><span id="intimacyTags"><span class="intimacy-tag" data-val="none">无</span><span class="intimacy-tag" data-val="condom">🍥戴套</span><span class="intimacy-tag" data-val="pill">💊吃药</span><span class="intimacy-tag" data-val="outside">🚫体外</span><span class="intimacy-tag" data-val="other">❓其他</span></span></div>
        <textarea id="modalNote" placeholder="备注……" rows="2" style="width:100%; border-radius:12px; border:2px solid #e3cd9e; padding:6px; resize:none; font-size:0.8rem;"></textarea>
        <div class="modal-row"><label style="background:#f0e5d3;padding:6px 10px;border-radius:12px;font-size:0.7rem;cursor:pointer;" for="imageUpload">📷 配图</label><input type="file" id="imageUpload" accept="image/*" style="display:none;"><span id="imagePreview" style="font-size:0.7rem;cursor:pointer;"></span></div>
        <div style="display:flex;gap:4px;"><button class="btn btn-delete" id="modalDelete">🗑 删除</button><button class="btn btn-close" id="modalClose">关闭</button></div>
      </div>
    </div>
    <div class="image-modal" id="imageModal"><img id="largeImage" src="" alt="大图"><button class="close-img-btn" id="closeImageBtn">关闭</button></div>
  `;

  // 周期手账JS
  (function(){
    const STORAGE_CYCLE = 'cycle_v5_';
    const STORAGE_SETTINGS = 'cycle_settings_v5';
    function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function addDays(ds,n){ const d=new Date(ds); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function dateCompare(a,b){ return new Date(a)-new Date(b); }
    function getData(ds){ const r=localStorage.getItem(STORAGE_CYCLE+ds); return r?JSON.parse(r):{isPeriod:false,pain:'',flow:'',intimacy:'none',note:'',image:''}; }
    function setData(ds,obj){ localStorage.setItem(STORAGE_CYCLE+ds,JSON.stringify(obj)); }
    function delData(ds){ localStorage.removeItem(STORAGE_CYCLE+ds); }
    function getSettings(){ const r=localStorage.getItem(STORAGE_SETTINGS); return r?JSON.parse(r):{cycleLength:28,periodLength:5,lastPeriodStart:null,lutealLength:14}; }
    function saveSettings(s){ localStorage.setItem(STORAGE_SETTINGS,JSON.stringify(s)); }

    let calYear,calMonth;
    const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth()+1;
    const monthLabel=document.getElementById('monthLabel');
    const calHead=document.getElementById('calendarHead');
    const calBody=document.getElementById('calendarBody');
    const cycleHint=document.getElementById('cycleHint');
    function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

    function getPredictions(year,month){
      const s=getSettings();
      const res={predicted:[],fertile:[],ovulation:[],luteal:[]};
      if(!s.lastPeriodStart) return res;
      const plen=s.periodLength||5, clen=s.cycleLength||28, llen=s.lutealLength||14;
      let ns=new Date(s.lastPeriodStart); ns.setDate(ns.getDate()-clen*3);
      for(let i=0;i<12;i++){
        ns.setDate(ns.getDate()+clen);
        const ss=`${ns.getFullYear()}-${String(ns.getMonth()+1).padStart(2,'0')}-${String(ns.getDate()).padStart(2,'0')}`;
        for(let j=0;j<plen;j++){ const pd=addDays(ss,j); const [py,pm]=pd.split('-').map(Number); if(py===year&&pm===month) res.predicted.push(parseInt(pd.split('-')[2])); }
        const ovDate=addDays(ss,-llen); const [oy,om,od]=ovDate.split('-').map(Number);
        if(oy===year&&om===month) res.ovulation.push(od);
        let fc=addDays(ovDate,-5);
        while(dateCompare(fc,ovDate)<=0){ const [fy,fm,fd]=fc.split('-').map(Number); if(fy===year&&fm===month) res.fertile.push(fd); fc=addDays(fc,1); }
        let lc=addDays(ovDate,1), le=addDays(ss,-1);
        while(dateCompare(lc,le)<=0){ const [ly,lm,ld]=lc.split('-').map(Number); if(ly===year&&lm===month) res.luteal.push(ld); lc=addDays(lc,1); }
      }
      const hasRecord=Array.from({length:daysInMonth(year,month)},(_,i)=>i+1).some(d=>getData(`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`).isPeriod);
      if(hasRecord) res.predicted=[];
      return res;
    }

    function renderCalendar(){
      monthLabel.textContent=`${calYear}年${calMonth}月`;
      calHead.innerHTML=''; ['日','一','二','三','四','五','六'].forEach(d=>{ const el=document.createElement('div'); el.className='day-header'; el.textContent=d; calHead.appendChild(el); });
      const dim=daysInMonth(calYear,calMonth);
      const fd=new Date(calYear,calMonth-1,1).getDay();
      const pred=getPredictions(calYear,calMonth);
      const tt=todayStr();
      const periodSet=new Set();
      for(let d=1;d<=dim;d++){ const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`; if(getData(ds).isPeriod) periodSet.add(d); }
      const expanded=new Set(periodSet);
      const arr=[...periodSet].sort((a,b)=>a-b);
      if(arr.length>=2){ for(let i=0;i<arr.length-1;i++){ for(let d=arr[i]+1;d<arr[i+1];d++) expanded.add(d); } }
      let html='';
      for(let i=0;i<fd;i++) html+='<div></div>';
      for(let d=1;d<=dim;d++){
        const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const data=getData(ds);
        let cls='day-cell', ovu='';
        if(expanded.has(d)) cls+=' period';
        else if(pred.ovulation.includes(d)){ cls+=' ovulation'; ovu='<span class="ovu-icon">🌸</span>'; }
        else if(pred.fertile.includes(d)) cls+=' fertile';
        else if(pred.predicted.includes(d)) cls+=' predicted';
        else if(pred.luteal.includes(d)) cls+=' luteal';
        else if(data.intimacy&&data.intimacy!=='none') cls+=' intimacy-only';
        if(ds===tt) cls+=' today';
        let extra='';
        if(data.note||data.pain||data.flow||(data.intimacy&&data.intimacy!=='none')) extra+='<div class="mini-dot"></div>';
        if(data.image) extra+=`<div class="mini-img" style="background-image:url(${data.image})"></div>`;
        if(ovu) extra+=ovu;
        html+=`<div class="${cls}" data-date="${ds}">${d}${extra}</div>`;
      }
      calBody.innerHTML=html;
      calBody.querySelectorAll('.day-cell').forEach(cell=>{ cell.addEventListener('click',function(){ openModal(this.getAttribute('data-date')); }); });
    }

    const appCard=document.getElementById('appCard');
    const changeBgBtn=document.getElementById('changeBgBtn');
    const resetBgBtn=document.getElementById('resetBgBtn');
    const bgFileInput=document.getElementById('bgFileInput');
    const SKIN_KEY='my_skin_bg';
    const savedBg=localStorage.getItem(SKIN_KEY);
    if(savedBg&&appCard) appCard.style.backgroundImage=`url(${savedBg})`;
    changeBgBtn.addEventListener('click',()=>{ bgFileInput.click(); });
    bgFileInput.addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ const d=ev.target.result; appCard.style.backgroundImage=`url(${d})`; localStorage.setItem(SKIN_KEY,d); }; r.readAsDataURL(f); });
    resetBgBtn.addEventListener('click',()=>{ appCard.style.backgroundImage=''; localStorage.removeItem(SKIN_KEY); });

    document.getElementById('prevMonth').addEventListener('click',()=>{ calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderCalendar(); });
    document.getElementById('nextMonth').addEventListener('click',()=>{ calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderCalendar(); });

    const modalOverlay=document.getElementById('modalOverlay');
    const modalDateTitle=document.getElementById('modalDateTitle');
    const toggleTrack=document.getElementById('toggleTrack');
    const periodHint=document.getElementById('periodHint');
    const painEmojis=document.getElementById('painEmojis');
    const flowEmojis=document.getElementById('flowEmojis');
    const modalNote=document.getElementById('modalNote');
    const imageUpload=document.getElementById('imageUpload');
    const imagePreview=document.getElementById('imagePreview');
    const largeImage=document.getElementById('largeImage');
    const imageModal=document.getElementById('imageModal');

    let curDate=null,curImg='',curPain='',curFlow='',curIntimacy='none',curPeriod=false;
    const painOpts=['😊','😐','😖'];
    const flowOpts=['🩸','🩸🩸','🩸🩸🩸'];

    function renderPain(){ painEmojis.innerHTML=painOpts.map(e=>`<span class="modal-emoji${curPain===e?' selected':''}" data-v="${e}">${e}</span>`).join(''); painEmojis.querySelectorAll('.modal-emoji').forEach(el=>{ el.addEventListener('click',function(){ curPain=this.getAttribute('data-v'); renderPain(); }); }); }
    function renderFlow(){ flowEmojis.innerHTML=flowOpts.map(e=>`<span class="modal-emoji${curFlow===e?' selected':''}" data-v="${e}">${e}</span>`).join(''); flowEmojis.querySelectorAll('.modal-emoji').forEach(el=>{ el.addEventListener('click',function(){ curFlow=this.getAttribute('data-v'); renderFlow(); }); }); }
    function renderIntimacy(){ document.querySelectorAll('#intimacyTags .intimacy-tag').forEach(tag=>{ tag.classList.toggle('selected',tag.getAttribute('data-val')===curIntimacy); tag.onclick=function(){ curIntimacy=this.getAttribute('data-val'); renderIntimacy(); }; }); }
    function updatePeriodHint(){ if(!curPeriod){ periodHint.textContent=''; return; } const prev=getData(addDays(curDate,-1)),next=getData(addDays(curDate,1)); if(prev.isPeriod&&!next.isPeriod) periodHint.textContent='💡 可能是经期最后一天'; else if(!prev.isPeriod&&next.isPeriod) periodHint.textContent='💡 可能是经期第一天'; else if(prev.isPeriod&&next.isPeriod) periodHint.textContent='💡 经期中'; else periodHint.textContent='💡 标记为经期日'; }

    document.getElementById('periodToggle').addEventListener('click',function(){ curPeriod=!curPeriod; toggleTrack.classList.toggle('on',curPeriod); updatePeriodHint(); });

    function autoSaveAndClose(){ if(!curDate) return; setData(curDate,{isPeriod:curPeriod,pain:curPain,flow:curFlow,intimacy:curIntimacy,note:modalNote.value.trim(),image:curImg}); if(curPeriod){ const s=getSettings(); let all=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(STORAGE_CYCLE)){ const d=k.replace(STORAGE_CYCLE,''); if(getData(d).isPeriod) all.push(d); } } all.sort((a,b)=>dateCompare(a,b)); if(all.length>0){ s.lastPeriodStart=all[all.length-1]; saveSettings(s); } } modalOverlay.classList.remove('show'); renderCalendar(); }
    function openModal(ds){ curDate=ds; modalDateTitle.textContent=ds; const data=getData(ds); curPeriod=data.isPeriod||false; toggleTrack.classList.toggle('on',curPeriod); curPain=data.pain||''; curFlow=data.flow||''; curIntimacy=data.intimacy||'none'; modalNote.value=data.note||''; curImg=data.image||''; imagePreview.textContent=curImg?'✅ 已附图 (点我看大图)':''; imagePreview.style.cursor=curImg?'pointer':'default'; imageUpload.value=''; updatePeriodHint(); renderPain(); renderFlow(); renderIntimacy(); modalOverlay.classList.add('show'); }

    imagePreview.addEventListener('click',function(){ if(curImg){ largeImage.src=curImg; imageModal.classList.add('show'); } });
    imageUpload.addEventListener('change',function(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){ curImg=ev.target.result; imagePreview.textContent='✅ 已选图'; imagePreview.style.cursor='pointer'; }; r.readAsDataURL(f); });
    document.getElementById('modalDelete').addEventListener('click',function(){ if(!curDate) return; if(confirm('确定删除这一天的记录吗？')){ delData(curDate); modalOverlay.classList.remove('show'); renderCalendar(); cycleHint.textContent='🗑 已删除'; setTimeout(()=>{cycleHint.textContent='';},1500); } });
    document.getElementById('modalClose').addEventListener('click',autoSaveAndClose);
    modalOverlay.addEventListener('click',function(e){ if(e.target===modalOverlay) autoSaveAndClose(); });
    document.getElementById('closeImageBtn').addEventListener('click',function(){ imageModal.classList.remove('show'); });
    imageModal.addEventListener('click',function(e){ if(e.target===imageModal) imageModal.classList.remove('show'); });

    renderCalendar();
  })();
}

// ==================== 菜谱选购模块 ====================
function loadRecipeModule() {
  document.getElementById('recipeContent').innerHTML = `
    <div class="recipe-container">
      <div class="recipe-header"><h1>🍳 今天吃什么</h1></div>
      <div class="recipe-main">
        <div class="category-sidebar" id="categorySidebar"></div>
        <div class="dish-list" id="dishList"></div>
      </div>
      <div class="recipe-bottom-bar">
        <span class="cart-info" id="cartInfo">已选 0 道菜</span>
        <button class="view-list-btn" id="viewListBtn">📋 采购小票</button>
      </div>
    </div>
    <button class="add-dish-btn" id="addDishBtn" title="添加新菜">+</button>
    <div class="modal-overlay" id="receiptModal"><div class="receipt-modal"><h3 style="text-align:center;">🧾 采购清单</h3><div id="receiptList"></div><button class="close-receipt" id="closeReceiptBtn">关闭</button></div></div>
    <div class="edit-modal" id="editModal">
      <div class="edit-box">
        <h3 id="editTitle">添加新菜</h3>
        <input type="text" id="editName" placeholder="菜名">
        <select id="editCategory"><option value="荤菜">荤菜</option><option value="素菜">素菜</option><option value="汤羹">汤羹</option><option value="甜品">甜品</option><option value="主食">主食</option><option value="其他">其他</option></select>
        <input type="text" id="editIngredients" placeholder="食材，用逗号分隔（如：番茄,鸡蛋,葱）">
        <div class="row"><label for="editImage" style="flex:1;background:#f0e5d3;padding:8px;border-radius:12px;text-align:center;cursor:pointer;">📷 选择图片</label><input type="file" id="editImage" accept="image/*" style="display:none;"><span id="editImagePreview" style="font-size:0.7rem;"></span></div>
        <div class="row" style="justify-content:space-between;"><button class="btn btn-primary" id="saveDishBtn">保存</button><button class="btn btn-danger" id="deleteDishBtn" style="display:none;">删除</button><button class="btn btn-neutral" id="cancelEditBtn">取消</button></div>
      </div>
    </div>
  `;

  // 菜谱JS
  (function(){
    const STORAGE_KEY='my_menu_data',STORAGE_CART='my_menu_cart';
    const defaultMenu=[{name:'番茄炒蛋',category:'荤菜',ingredients:['番茄','鸡蛋','葱','盐','糖'],image:''},{name:'青椒肉丝',category:'荤菜',ingredients:['青椒','猪肉','蒜','酱油','淀粉'],image:''},{name:'蒜蓉西兰花',category:'素菜',ingredients:['西兰花','蒜','蚝油','盐'],image:''},{name:'可乐鸡翅',category:'荤菜',ingredients:['鸡翅','可乐','姜','料酒','生抽'],image:''}];
    let menuData=[],selectedDishes=[],currentCategory='全部',editingIndex=-1,tempImageData='';

    function loadMenu(){ const r=localStorage.getItem(STORAGE_KEY); menuData=r?JSON.parse(r):defaultMenu; if(!r) localStorage.setItem(STORAGE_KEY,JSON.stringify(defaultMenu)); }
    function saveMenu(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(menuData)); }
    function loadCart(){ const r=localStorage.getItem(STORAGE_CART); selectedDishes=r?JSON.parse(r):[]; }
    function saveCart(){ localStorage.setItem(STORAGE_CART,JSON.stringify(selectedDishes)); }
    function getCategories(){ const cats=new Set(menuData.map(d=>d.category)); return['全部',...Array.from(cats)]; }

    function renderCategories(){
      document.getElementById('categorySidebar').innerHTML=getCategories().map(c=>`<div class="category-item${c===currentCategory?' active':''}" data-cat="${c}">${c}</div>`).join('');
      document.querySelectorAll('.category-item').forEach(item=>{ item.addEventListener('click',function(){ currentCategory=this.getAttribute('data-cat'); renderCategories(); renderDishes(); }); });
    }

    function renderDishes(){
      const filtered=currentCategory==='全部'?menuData:menuData.filter(d=>d.category===currentCategory);
      document.getElementById('dishList').innerHTML=filtered.map(dish=>{
        const gi=menuData.indexOf(dish);
        const is=dish.image?`background-image:url('${dish.image}')`:'';
        return `<div class="dish-card"><div class="dish-img" style="${is}"></div><div class="dish-info"><div class="dish-name">${dish.name}</div><div class="dish-ingredients">${dish.ingredients.map(i=>`<span class="ingredient-tag">${i}</span>`).join('')}</div></div><button class="add-btn" data-index="${gi}">➕</button></div>`;
      }).join('');
      document.querySelectorAll('.add-btn').forEach(btn=>{ btn.addEventListener('click',function(e){ e.stopPropagation(); const i=parseInt(this.getAttribute('data-index')); if(!selectedDishes.includes(i)){ selectedDishes.push(i); saveCart(); updateCartInfo(); } }); });
      document.querySelectorAll('.dish-card').forEach((card,i)=>{ card.addEventListener('click',function(){ openEditor(menuData.indexOf(filtered[i])); }); });
    }

    function updateCartInfo(){ document.getElementById('cartInfo').textContent=`已选 ${selectedDishes.length} 道菜`; }

    function renderReceipt(){
      const all=[]; selectedDishes.forEach(i=>{ const d=menuData[i]; if(d) d.ingredients.forEach(ing=>all.push(ing)); });
      const unique=[...new Set(all)];
      document.getElementById('receiptList').innerHTML=unique.map(ing=>`<div class="receipt-item" data-ing="${ing}"><div class="check-box"></div><span>${ing}</span></div>`).join('');
      document.querySelectorAll('.receipt-item').forEach(item=>{ item.addEventListener('click',function(){ this.classList.toggle('checked'); }); });
    }

    function openEditor(index){
      editingIndex=index; const dish=index>=0?menuData[index]:null;
      document.getElementById('editTitle').textContent=index>=0?'编辑菜品':'添加新菜';
      document.getElementById('editName').value=dish?dish.name:'';
      document.getElementById('editCategory').value=dish?dish.category:'荤菜';
      document.getElementById('editIngredients').value=dish?dish.ingredients.join(','):'';
      document.getElementById('editImagePreview').textContent=dish&&dish.image?'✅ 已有图':'';
      tempImageData=dish?dish.image||'':'';
      document.getElementById('deleteDishBtn').style.display=index>=0?'inline-block':'none';
      document.getElementById('editModal').classList.add('show');
    }

    document.getElementById('addDishBtn').addEventListener('click',()=>openEditor(-1));
    document.getElementById('editImage').addEventListener('change',function(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){ tempImageData=ev.target.result; document.getElementById('editImagePreview').textContent='✅ 已选图'; }; r.readAsDataURL(f); });
    document.getElementById('saveDishBtn').addEventListener('click',function(){
      const name=document.getElementById('editName').value.trim();
      const category=document.getElementById('editCategory').value;
      const raw=document.getElementById('editIngredients').value.trim();
      if(!name||!raw) return alert('菜名和食材不能为空');
      const ingredients=raw.split(/[,，]/).map(s=>s.trim()).filter(s=>s);
      const dish={name,category,ingredients,image:tempImageData};
      if(editingIndex>=0) menuData[editingIndex]=dish; else menuData.push(dish);
      saveMenu(); document.getElementById('editModal').classList.remove('show'); renderCategories(); renderDishes();
    });
    document.getElementById('deleteDishBtn').addEventListener('click',function(){ if(editingIndex>=0&&confirm('确定删除这道菜吗？')){ menuData.splice(editingIndex,1); selectedDishes=selectedDishes.filter(i=>i!==editingIndex).map(i=>i>editingIndex?i-1:i); saveMenu(); saveCart(); document.getElementById('editModal').classList.remove('show'); renderCategories(); renderDishes(); updateCartInfo(); } });
    document.getElementById('cancelEditBtn').addEventListener('click',()=>{ document.getElementById('editModal').classList.remove('show'); });
    document.getElementById('viewListBtn').addEventListener('click',()=>{ renderReceipt(); document.getElementById('receiptModal').classList.add('show'); });
    document.getElementById('closeReceiptBtn').addEventListener('click',()=>{ document.getElementById('receiptModal').classList.remove('show'); });
    document.getElementById('receiptModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });

    loadMenu(); loadCart(); renderCategories(); renderDishes(); updateCartInfo();
  })();
}

// ==================== 初始化主页 ====================
renderJList();
renderPGrid();
</script>
