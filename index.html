<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='#c9a84c'/><text x='90' y='110' font-size='80' text-anchor='middle'>🏠</text></svg>">
  <title>我</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a1510;
      --bg-card: #221d16;
      --bg-surface: #2a2318;
      --bg-elevated: #322a1e;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-dim: #8a6d2e;
      --cream: #f5edd8;
      --cream-dim: #c4b08a;
      --text-primary: #f0e6cc;
      --text-secondary: #9d8a6a;
      --text-muted: #5a4e38;
      --border: rgba(201,168,76,0.18);
      --border-bright: rgba(201,168,76,0.45);
      --glow: rgba(201,168,76,0.12);
      --font-title: 'Playfair Display', serif;
      --font-body: 'Noto Serif SC', serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background:#0d0b08;
      font-family:var(--font-body);
      display:flex; justify-content:center; align-items:center;
      min-height:100vh; padding:16px; margin:0;
    }
    .app-frame {
      width:100%; max-width:420px; height:85vh; max-height:750px;
      background:var(--bg-deep);
      border-radius:40px;
      box-shadow:0 0 60px rgba(201,168,76,0.08),0 40px 80px rgba(0,0,0,0.8);
      overflow:hidden; display:flex; flex-direction:column;
      border:1px solid rgba(201,168,76,0.3);
      position:relative;
    }

    @keyframes bgFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,30px)} }
    @keyframes bgFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-15px,-20px)} }
    @keyframes cardIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .curtain-handle {
      width:70px; height:14px;
      background:linear-gradient(to bottom, var(--gold-dim), var(--gold));
      border-radius:0 0 18px 18px; margin:0 auto;
      cursor:pointer; z-index:50; position:absolute; top:0; left:50%;
      transform:translateX(-50%); transition:top 0.3s;
    }
    .curtain-panel {
      position:absolute; top:-100%; left:0; width:100%; height:60%;
      background:var(--bg-card); z-index:40;
      border-radius:0 0 30px 30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
      border-bottom:1px solid var(--border);
      transition:top 0.3s ease;
      padding:30px 16px 20px; overflow-y:auto;
      display:flex; flex-direction:column; gap:10px;
    }
    .curtain-overlay {
      position:absolute; top:0; left:0; width:100%; height:100%;
      z-index:39; display:none; pointer-events:auto;
    }
    .curtain-overlay.open { display:block; }
    .curtain-panel.open { top:0; }
    .curtain-handle.open { top:60%; }
    .curtain-item {
      display:flex; align-items:center; gap:10px; padding:8px;
      background:var(--bg-elevated); border:1px solid var(--border);
      border-radius:14px; cursor:grab;
    }
    .curtain-item:active { cursor:grabbing; }
    .curtain-item.checked { opacity:0.5; }
    .curtain-item.checked span { text-decoration:line-through; }
    .curtain-checkbox {
      width:20px; height:20px; border-radius:6px;
      border:2px solid var(--gold-dim); flex-shrink:0;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    .curtain-item.checked .curtain-checkbox { background:var(--gold-dim); border-color:var(--gold-dim); }
    .curtain-item.checked .curtain-checkbox::after { content:'✓'; color:var(--bg-deep); font-weight:bold; font-size:0.8rem; }

    .top-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:16px 20px 8px; flex-shrink:0;
      border-bottom:1px solid var(--border); padding-bottom:12px;
    }
    .top-bar h2 { font-family:var(--font-title); color:var(--gold-light); letter-spacing:2px; font-size:1.3rem; }
    .mode-toggle {
      background:var(--bg-elevated); border:1px solid var(--border);
      color:var(--gold-dim); border-radius:20px;
      padding:8px 14px; font-weight:bold; cursor:pointer; font-size:0.7rem; letter-spacing:1px;
    }

    .page-area { flex:1; overflow-y:auto; padding:8px 16px 16px; }
    .j-list { display:flex; flex-direction:column; gap:10px; }
    .j-item {
      display:flex; align-items:center; gap:14px;
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:22px; padding:18px 20px; cursor:pointer;
      transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      position:relative; overflow:hidden;
      animation:cardIn 0.5s ease backwards;
    }
    .j-item:nth-child(1){animation-delay:0.05s}
    .j-item:nth-child(2){animation-delay:0.12s}
    .j-item:nth-child(3){animation-delay:0.19s}
    .j-item:nth-child(4){animation-delay:0.26s}
    .j-item:active { background:var(--bg-elevated); border-color:var(--border-bright); transform:scale(0.98); }
    .j-icon { font-size:2rem; width:48px; text-align:center; }
    .j-info { flex:1; }
    .j-name { color:var(--text-primary); font-size:1rem; font-weight:600; }
    .j-desc { color:var(--text-secondary); font-size:0.7rem; margin-top:2px; }
    .j-arrow {
      width:28px; height:28px; border-radius:50%;
      background:var(--bg-surface); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      color:var(--gold-dim); font-size:0.75rem;
    }
    .p-grid { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; padding:10px 0; }
    .p-bubble {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:28px; padding:20px 16px; cursor:pointer;
      text-align:center; transition:all 0.3s;
    }
    .p-bubble:active { background:var(--bg-elevated); border-color:var(--border-bright); transform:scale(0.95); box-shadow:0 0 20px var(--glow); }
    .p-bubble.size-lg { width:140px; height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
    .p-bubble.size-md { width:110px; height:100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
    .p-bubble.size-sm { width:90px; height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
    .p-icon { font-size:2rem; }
    .p-name { font-weight:bold; font-size:0.85rem; color:var(--text-primary); }

    .func-page { display:none; flex-direction:column; height:100%; }
    .func-page.active { display:flex; }
    .func-header {
      display:flex; align-items:center; gap:10px; padding:8px 16px;
      flex-shrink:0; border-bottom:1px solid var(--border); padding-bottom:12px;
    }
    .back-btn {
      background:var(--bg-elevated); border:1px solid var(--border);
      color:var(--gold-dim); border-radius:12px;
      width:36px; height:36px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:0.85rem;
    }
    .back-btn:active { border-color:var(--border-bright); }
    .func-content { flex:1; overflow-y:auto; padding:0 8px 8px; }

    .app-card {
      width:100%; background:var(--bg-card); border:1px solid var(--border);
      border-radius:24px; padding:16px 10px 18px;
      display:flex; flex-direction:column; gap:10px;
      background-size:cover; background-position:center; background-repeat:no-repeat;
      position:relative;
    }
    .app-card::before {
      content:''; position:absolute; top:0; left:0; right:0; bottom:0;
      background:rgba(26,21,16,0.8); border-radius:22px; z-index:0; pointer-events:none;
    }
    .app-card > * { position:relative; z-index:1; }
    .app-card h2 { font-family:var(--font-title); color:var(--gold-light); font-size:1.3rem; letter-spacing:2px; text-align:center; }
    .month-header { display:flex; justify-content:space-between; align-items:center; font-weight:bold; color:var(--text-secondary); }
    .month-nav {
      background:var(--bg-elevated); border:1px solid var(--border);
      color:var(--gold-dim); border-radius:50%;
      font-size:1.2rem; width:34px; height:34px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
    .day-header { font-size:0.6rem; color:var(--text-muted); font-weight:bold; padding:3px 0; }
    .day-cell {
      aspect-ratio:1; border-radius:8px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-size:0.8rem; background:rgba(255,255,255,0.03); color:var(--text-secondary);
      cursor:pointer; border:2px solid transparent; font-weight:bold; position:relative;
    }
    .day-cell.period { background:rgba(232,160,176,0.15); color:#e8a0b0; border:1px solid rgba(232,160,176,0.3); }
    .day-cell.predicted { background:rgba(200,160,220,0.08); color:#c0a0d8; border:1px dashed rgba(200,160,220,0.25); }
    .day-cell.fertile { background:rgba(100,200,180,0.1); color:#80c8b0; border:1px solid rgba(100,200,180,0.2); }
    .day-cell.ovulation { background:rgba(100,200,180,0.2); color:#60d0b0; border:1px solid rgba(100,200,180,0.4); }
    .day-cell.luteal { background:rgba(201,168,76,0.08); color:var(--gold-dim); border:1px solid rgba(201,168,76,0.15); }
    .day-cell.intimacy-only { background:rgba(232,160,176,0.1); color:#e8a0b0; border:1px solid rgba(232,160,176,0.2); }
    .day-cell.today { box-shadow:0 0 0 2px var(--gold); color:var(--gold-light); font-weight:700; }
    .mini-dot { width:4px; height:4px; background:#e8a0b0; border-radius:50%; margin-top:1px; }
    .mini-img { width:14px; height:14px; border-radius:3px; background-size:cover; background-position:center; margin-top:1px; }
    .ovu-icon { font-size:0.5rem; position:absolute; top:1px; right:1px; }
    .legend { display:flex; gap:4px; font-size:0.55rem; color:var(--text-muted); flex-wrap:wrap; justify-content:center; }
    .legend span { display:flex; align-items:center; gap:1px; }
    .legend-dot { width:8px; height:8px; border-radius:2px; display:inline-block; }
    .hint-text { font-size:0.65rem; color:var(--text-muted); text-align:center; min-height:14px; }

    .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:10; }
    .modal-overlay.show { display:flex; }
    .modal-box {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:24px; padding:18px 14px; width:85%; max-width:340px;
      box-shadow:0 20px 60px rgba(0,0,0,0.6);
      display:flex; flex-direction:column; gap:8px; max-height:75vh; overflow-y:auto;
    }
    .modal-box strong { color:var(--gold-light); font-family:var(--font-title); }
    .modal-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .modal-emoji {
      font-size:1.6rem; cursor:pointer; padding:2px 5px; border-radius:10px;
      background:var(--bg-elevated); border:1px solid var(--border);
    }
    .modal-emoji.selected { background:rgba(160,144,200,0.2); border-color:rgba(160,144,200,0.5); box-shadow:0 0 12px rgba(160,144,200,0.2); }
    .toggle-row { display:flex; align-items:center; gap:8px; font-weight:bold; cursor:pointer; padding:4px 0; }
    .toggle-track { width:42px; height:24px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px; position:relative; flex-shrink:0; }
    .toggle-track.on { background:rgba(232,160,176,0.3); border-color:rgba(232,160,176,0.5); }
    .toggle-thumb { width:20px; height:20px; background:var(--cream-dim); border-radius:50%; position:absolute; top:2px; left:2px; transition:0.2s; }
    .toggle-track.on .toggle-thumb { left:20px; background:#e8a0b0; }
    .btn { border:none; padding:8px 14px; border-radius:14px; font-weight:bold; cursor:pointer; font-size:0.8rem; }
    .btn-delete { background:rgba(232,160,176,0.15); color:#e8a0b0; border:1px solid rgba(232,160,176,0.2); }
    .btn-close { background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border); }
    .intimacy-tag {
      background:var(--bg-elevated); color:var(--text-muted);
      padding:4px 8px; border-radius:12px; font-size:0.7rem; font-weight:bold;
      cursor:pointer; border:1px solid var(--border);
    }
    .intimacy-tag.selected { background:rgba(232,160,176,0.15); color:#e8a0b0; border-color:rgba(232,160,176,0.4); }

    .image-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:20; flex-direction:column; gap:12px; }
    .image-modal.show { display:flex; }
    .image-modal img { max-width:90%; max-height:75%; border-radius:14px; border:4px solid var(--border-bright); }
    .image-modal .close-img-btn { background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border); padding:8px 22px; border-radius:20px; font-weight:bold; cursor:pointer; }

    .recipe-container {
      width:100%; background:var(--bg-deep); border:1px solid var(--border);
      border-radius:24px; overflow:hidden; display:flex; flex-direction:column; height:100%;
    }
    .recipe-header {
      padding:16px 14px 10px; border-bottom:1px solid var(--border);
      flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
    }
    .recipe-header h1 { font-family:var(--font-title); color:var(--gold-light); font-size:1.3rem; margin:0; }
    .recipe-main { display:flex; flex:1; overflow:hidden; }
    .category-sidebar {
      width:60px; background:var(--bg-card); border-right:1px solid var(--border);
      overflow-y:auto; padding:6px 0; flex-shrink:0;
    }
    .category-item {
      text-align:center; padding:10px 2px; cursor:pointer;
      font-size:0.65rem; color:var(--text-muted); border-radius:10px;
      margin:0 4px; font-weight:bold;
    }
    .category-item.active { background:rgba(201,168,76,0.12); color:var(--gold); }
    .dish-list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; }
    .dish-card {
      display:flex; gap:8px; background:var(--bg-card); border:1px solid var(--border);
      border-radius:16px; padding:8px; transition:all 0.2s; align-items:center;
    }
    .dish-card:active { background:var(--bg-elevated); }
    .dish-img { width:52px; height:52px; border-radius:12px; background-size:cover; background-position:center; background-color:var(--bg-surface); flex-shrink:0; }
    .dish-info { flex:1; min-width:0; }
    .dish-name { font-weight:bold; font-size:0.9rem; color:var(--text-primary); margin-bottom:2px; }
    .dish-ingredients { font-size:0.65rem; display:flex; flex-wrap:wrap; gap:2px; }
    .ingredient-tag { background:rgba(201,168,76,0.08); color:var(--gold-dim); padding:1px 6px; border-radius:8px; font-size:0.6rem; }
    .qty-btn { border:none; color:white; width:24px; height:24px; border-radius:50%; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .qty-btn.minus { background:rgba(232,160,176,0.2); color:#e8a0b0; }
    .qty-btn.plus { background:rgba(201,168,76,0.2); color:var(--gold); }
    .add-btn {
      background:linear-gradient(135deg, var(--gold-dim), var(--gold));
      color:var(--bg-deep); border:none; font-size:1rem;
      width:30px; height:30px; border-radius:50%; cursor:pointer;
      flex-shrink:0; box-shadow:0 3px 10px rgba(201,168,76,0.25);
    }
    .add-btn:active { transform:translateY(2px); box-shadow:none; }
    .qty-wrap { display:flex; align-items:center; gap:6px; }
    .qty-num { font-weight:bold; min-width:18px; text-align:center; font-size:0.9rem; color:var(--text-primary); }
    .recipe-bottom-bar {
      background:var(--bg-card); border-top:1px solid var(--border);
      padding:10px 14px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
    }
    .cart-info { font-weight:bold; color:var(--text-secondary); font-size:0.8rem; }
    .view-list-btn {
      background:linear-gradient(135deg, var(--gold-dim), var(--gold));
      color:var(--bg-deep); border:none; padding:6px 14px;
      border-radius:16px; font-weight:700; cursor:pointer; font-size:0.8rem;
    }
    .add-dish-header-btn {
      background:linear-gradient(135deg, var(--gold-dim), var(--gold));
      color:var(--bg-deep); border:none; width:34px; height:34px;
      border-radius:50%; font-size:1.3rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 3px 10px rgba(201,168,76,0.25);
    }

    .receipt-modal {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:24px; padding:20px 14px; width:85%; max-width:340px;
      max-height:60vh; overflow-y:auto;
    }
    .receipt-item {
      display:flex; align-items:center; gap:8px; padding:8px 0;
      border-bottom:1px dashed rgba(201,168,76,0.15); color:var(--text-secondary);
      cursor:pointer; font-size:0.85rem;
    }
    .receipt-item.checked { text-decoration:line-through; color:var(--text-muted); }
    .check-box {
      width:18px; height:18px; border-radius:4px;
      border:2px solid var(--gold-dim); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .receipt-item.checked .check-box { background:var(--gold-dim); }
    .receipt-item.checked .check-box::after { content:'✓'; color:var(--bg-deep); font-weight:bold; font-size:0.7rem; }
    .close-receipt {
      background:var(--bg-elevated); color:var(--text-secondary);
      border:1px solid var(--border); padding:8px 18px; border-radius:16px;
      margin-top:12px; font-weight:bold; cursor:pointer; width:100%;
    }

    .edit-modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:30; }
    .edit-modal.show { display:flex; }
    .edit-box {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:22px; padding:18px 14px; width:90%; max-width:360px;
      display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow-y:auto;
    }
    .edit-box input, .edit-box textarea, .edit-box select {
      width:100%; padding:8px; border-radius:12px;
      border:1px solid var(--border); font-size:0.85rem;
      background:var(--bg-elevated); color:var(--text-primary); outline:none;
    }
    .edit-box .row { display:flex; gap:6px; align-items:center; }
    .btn-primary { background:linear-gradient(135deg, var(--gold-dim), var(--gold)); color:var(--bg-deep); border:none; }
    .btn-danger { background:rgba(232,160,176,0.15); color:#e8a0b0; border:1px solid rgba(232,160,176,0.2); }
    .btn-neutral { background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border); }

    .work-card {
      width:100%; background:var(--bg-card); border:1px solid rgba(122,184,122,0.2);
      border-radius:24px; padding:24px 20px;
      display:flex; flex-direction:column; gap:24px; text-align:center;
    }
    .money-display {
      background:linear-gradient(135deg, #0e1a0e, #1a2a18);
      border:1px solid rgba(122,184,122,0.2); border-radius:20px; padding:24px;
    }
    .money-display .big-number {
      font-family:var(--font-title); font-size:2.8rem; font-weight:bold;
      color:#a8e8a8; text-shadow:0 0 30px rgba(122,184,122,0.3); word-break:break-all;
    }
    .money-display small { color:#6a9a6a; font-size:0.85rem; display:block; margin-top:6px; }
    .toggle-btn {
      background:var(--bg-elevated); color:var(--text-muted);
      border:1px solid var(--border); padding:6px 14px; border-radius:16px;
      font-weight:bold; cursor:pointer; font-size:0.75rem;
    }
    .toggle-btn.active { background:rgba(122,184,122,0.15); color:#a8e8a8; border-color:rgba(122,184,122,0.4); }
    .time-section { display:flex; flex-direction:column; gap:12px; }
    .time-row { display:flex; justify-content:space-between; gap:12px; }
    .time-box {
      flex:1; background:var(--bg-elevated); border:1px solid var(--border);
      border-radius:16px; padding:16px;
    }
    .time-box label { color:var(--text-muted); font-size:0.8rem; display:block; margin-bottom:6px; }
    .time-box input {
      width:100%; text-align:center; border:1px solid var(--border);
      border-radius:10px; padding:8px; font-size:0.9rem;
      background:var(--bg-surface); color:var(--gold-light); font-weight:bold;
    }
    .info-section { display:flex; flex-direction:column; gap:8px; }

      display:flex; justify-content:space-between; align-items:center;

      border-radius:14px; padding:10px 14px;
    }
    .setting-row label { color:var(--text-secondary); font-size:0.8rem; }
    .setting-row input {
      width:80px; padding:6px; border-radius:10px;
      border:1px solid var(--border); text-align:center;
      font-size:0.85rem; background:var(--bg-surface); color:var(--gold-light);
    }
    .btn-work {
      background:linear-gradient(135deg, #2a4a2a, #3a6a3a);
      color:#a8e8a8; border:1px solid rgba(122,184,122,0.3);
      box-shadow:0 4px 16px rgba(50,120,50,0.2);
      border-radius:20px; font-weight:bold; padding:14px;

      background:var(--bg-elevated); color:var(--text-secondary);

    .achieve-toast {
      position: absolute;
      top: 60px;

      border: 2px solid rgba(201,168,76,0.5);
      border-radius: 16px;
      padding: 14px;
      z-index: 200;
      transform: translateX(220px);

      animation: achieveGlow 2s ease-in-out infinite;
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: none;
    }
    .achieve-toast.show { transform: translateX(0); }
    @keyframes achieveGlow {
      0%,100% { box-shadow: 0 0 20px rgba(201,168,76,0.3); }
      50% { box-shadow: 0 0 35px rgba(201,168,76,0.6); }
    }
    .achieve-icon { font-size: 2rem; flex-shrink: 0; }
    .achieve-info { flex: 1; min-width: 0; }
    .achieve-label { font-size: 0.6rem; color: var(--gold-dim); letter-spacing: 1px; }
    .achieve-name { font-weight: bold; color: var(--gold-light); font-size: 0.9rem; }
    .achieve-desc { font-size: 0.65rem; color: var(--text-muted); }
    .achieve-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .achieve-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      transition: all 0.3s;
    }
    .achieve-card.locked { filter: grayscale(1) blur(2px); opacity: 0.4; }
    .achieve-card .ach-icon { font-size: 2rem; }
    .achieve-card .ach-name { font-weight: bold; color: var(--text-primary); font-size: 0.8rem; margin: 4px 0; }
    .achieve-card .ach-cond { font-size: 0.6rem; color: var(--text-muted); }
    .achieve-card .ach-date { font-size: 0.55rem; color: var(--gold-dim); margin-top: 4px; }
  </style>
</head>
<body>
<div class="app-frame" id="appFrame">
  <div style="position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(201,168,76,0.08) 0%,transparent 70%);border-radius:50%;filter:blur(60px);top:-80px;left:-60px;z-index:0;pointer-events:none;animation:bgFloat1 8s ease-in-out infinite;"></div>
  <div style="position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(180,120,40,0.06) 0%,transparent 70%);border-radius:50%;filter:blur(60px);bottom:100px;right:-40px;z-index:0;pointer-events:none;animation:bgFloat2 10s ease-in-out infinite;"></div>

  <div class="achieve-toast" id="achieveToast">
    <div class="achieve-icon" id="achieveToastIcon"></div>
    <div class="achieve-info">
      <div class="achieve-label">成就解锁</div>
      <div class="achieve-name" id="achieveToastName"></div>

  <div class="curtain-handle" id="curtainHandle"></div>
  <div class="curtain-panel" id="curtainPanel">

    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="text" id="manualTodoInput" placeholder="添加一条待办..." style="flex:1;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:8px 12px;border-radius:10px;font-size:0.8rem;">
      <button id="addManualTodoBtn" style="background:var(--gold-dim);color:var(--bg-deep);border:none;padding:8px 12px;border-radius:10px;font-weight:bold;cursor:pointer;">+</button>
    </div>
    <div id="curtainList"></div>
  </div>

  <div class="top-bar" id="topBar">
    <h2 id="topTitle" style="cursor:pointer;" onclick="editTitle()">🏠 我 <span style="font-size:0.7rem;">✏️</span></h2>
    <button class="mode-toggle" id="modeToggle">🔄 J人模式</button>
  </div>
  <div class="page-area" id="homePage">
    <div class="j-list" id="jListView"></div>
    <div class="p-grid" id="pGridView" style="display:none;"></div>
  </div>
  <div class="func-page" id="funcPeriod">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#e8a0b0;">🌸 周期手账</span></div>
    <div class="func-content" id="periodContent"></div>
  </div>
  <div class="func-page" id="funcRecipe">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#e8c97a;">🍳 菜谱选购</span></div>
    <div class="func-content" id="recipeContent"></div>
  </div>
  <div class="func-page" id="funcWork">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#a8e8a8;">💰 钱钱钱</span></div>
    <div class="func-content" id="workContent"></div>
  </div>
  <div class="func-page" id="funcDiary">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#e8c97a;">📸 日记相册</span></div>
    <div class="func-content" id="diaryContent"></div>
  </div>
  <div class="func-page" id="funcAchievement">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#e8c97a;">🏅 成就库</span></div>
    <div class="func-content" id="achievementContent"></div>
  </div>
  <div class="func-page" id="funcCommunity">
    <div class="func-header"><button class="back-btn" onclick="goHome()">←</button><span style="font-weight:bold;color:#e8c97a;">💬 树洞社区</span></div>
    <div class="func-content" id="communityContent"></div>
  </div>
</div>

<script>
// ==================== 全局待办聚合 ====================
function getCurtainItems() {
  const items = [];
  const cart = JSON.parse(localStorage.getItem('my_menu_cart') || '{}');
  const menu = JSON.parse(localStorage.getItem('my_menu_data') || '[]');
  const receipts = JSON.parse(localStorage.getItem('my_receipt_checked') || '{}');
  const ingredientCounts = {};
  Object.keys(cart).forEach(index => { const dish = menu[parseInt(index)]; const qty = cart[index] || 1; if (dish) { dish.ingredients.forEach(ing => { ingredientCounts[ing] = (ingredientCounts[ing] || 0) + qty; }); } });
  Object.keys(ingredientCounts).forEach(ing => { const key = `ing_${ing}`; if (!receipts[key]) { items.push({ id: key, text: `🛒 ${ing}${ingredientCounts[ing] > 1 ? ' x' + ingredientCounts[ing] : ''}`, source: 'recipe' }); } });
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const periodData = JSON.parse(localStorage.getItem('cycle_v5_' + dateStr) || '{}');
  if (periodData.note) { items.push({ id: 'period_note', text: `📝 ${periodData.note}`, source: 'period' }); }
  const savedOrder = JSON.parse(localStorage.getItem('my_curtain_order') || '[]');
  if (savedOrder.length > 0) { items.sort((a, b) => { const aIdx = savedOrder.indexOf(a.id); const bIdx = savedOrder.indexOf(b.id); if (aIdx === -1) return 1; if (bIdx === -1) return -1; return aIdx - bIdx; }); }
  const manualTodos = JSON.parse(localStorage.getItem('my_manual_todos') || '[]');
  manualTodos.forEach(todo => { const key = todo.id; if (!receipts[key]) { items.push({ id: key, text: todo.text, source: 'manual' }); } });
  return items;
}

let curtainOpen = false;
const curtainPanel = document.getElementById('curtainPanel');
const curtainHandle = document.getElementById('curtainHandle');
let curtainOverlay = null;
curtainHandle.addEventListener('click', toggleCurtain);

function toggleCurtain() {
  curtainOpen = !curtainOpen;
  if (curtainOpen) {
    if (!curtainOverlay) { curtainOverlay = document.createElement('div'); curtainOverlay.className = 'curtain-overlay'; curtainOverlay.id = 'curtainOverlay'; document.getElementById('appFrame').appendChild(curtainOverlay); curtainOverlay.addEventListener('click', toggleCurtain); }
    curtainPanel.classList.add('open'); curtainHandle.classList.add('open'); curtainOverlay.classList.add('open'); renderCurtain();
  } else { curtainPanel.classList.remove('open'); curtainHandle.classList.remove('open'); if (curtainOverlay) curtainOverlay.classList.remove('open'); }
}

function toggleCurtainItem(id) { const receipts = JSON.parse(localStorage.getItem('my_receipt_checked') || '{}'); if (receipts[id]) { delete receipts[id]; } else { receipts[id] = true; } localStorage.setItem('my_receipt_checked', JSON.stringify(receipts)); renderCurtain(); }

function renderCurtain() {
  const items = getCurtainItems(); const list = document.getElementById('curtainList'); const manualTodoInput = document.getElementById('manualTodoInput'); const addManualTodoBtn = document.getElementById('addManualTodoBtn');
  function addManualTodo() { const text = manualTodoInput.value.trim(); if (!text) return; const newItem = { id: 'manual_' + Date.now(), text: '✏️ ' + text, source: 'manual' }; const savedOrder = JSON.parse(localStorage.getItem('my_curtain_order') || '[]'); savedOrder.unshift(newItem.id); localStorage.setItem('my_curtain_order', JSON.stringify(savedOrder)); const manualTodos = JSON.parse(localStorage.getItem('my_manual_todos') || '[]'); manualTodos.unshift({ id: newItem.id, text: newItem.text }); localStorage.setItem('my_manual_todos', JSON.stringify(manualTodos)); manualTodoInput.value = ''; renderCurtain(); }
  addManualTodoBtn.onclick = addManualTodo; manualTodoInput.onkeydown = function(e) { if (e.key === 'Enter') { e.preventDefault(); addManualTodo(); } };
  if (items.length === 0) { list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">✨ 暂无待办，去逛逛吧</div>'; return; }
  list.innerHTML = items.map((item, index) => `<div class="curtain-item" draggable="true" data-index="${index}" data-id="${item.id}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dropItem(event)"><div class="curtain-checkbox" onclick="toggleCurtainItem('${item.id}')"></div><span style="flex:1;">${item.text}</span></div>`).join('');
}

// ==================== 主框架 ====================
const modules = [
  { id:'period', name:'周期手账', icon:'🌸', desc:'经期记录、排卵预测', size:'lg' },
  { id:'recipe', name:'菜谱选购', icon:'🍳', desc:'选菜、生成采购清单', size:'lg' },
  { id:'work', name:'钱钱钱💰', icon:'💰', desc:'防止裸辞神器', size:'lg' },
  { id:'diary', name:'日记相册', icon:'📸', desc:'拍照抠图记录生活', size:'lg' },
  { id:'community', name:'树洞社区', icon:'💬', desc:'发帖回复记录生活', size:'lg' },
  { id:'achievement', name:'🏅 成就库', icon:'🏆', desc:'看看你解锁了多少', size:'lg' },
  { id:'more', name:'更多', icon:'📦', desc:'即将上线', size:'sm' }
];
let isJMode = true;

function renderJList(){ document.getElementById('jListView').innerHTML = modules.map(m => `<div class="j-item" onclick="openModule('${m.id}')"><div class="j-icon">${m.icon}</div><div class="j-info"><div class="j-name">${m.name}</div><div class="j-desc">${m.desc}</div></div><div class="j-arrow">›</div></div>`).join(''); }
function renderPGrid(){ document.getElementById('pGridView').innerHTML = modules.map(m => `<div class="p-bubble size-${m.size}" onclick="openModule('${m.id}')"><div class="p-icon">${m.icon}</div><div class="p-name">${m.name}</div></div>`).join(''); }
document.getElementById('modeToggle').addEventListener('click', function(){ isJMode = !isJMode; this.textContent = isJMode ? '🔄 J人模式' : '🔄 P人模式'; document.getElementById('jListView').style.display = isJMode ? 'flex' : 'none'; document.getElementById('pGridView').style.display = isJMode ? 'none' : 'flex'; });
function openModule(id){
  document.getElementById('homePage').style.display = 'none'; document.getElementById('topBar').style.display = 'none';
  if(id === 'period'){ document.getElementById('funcPeriod').classList.add('active'); if(!window._periodLoaded){ loadPeriodModule(); window._periodLoaded = true; } }
  else if(id === 'achievement'){ document.getElementById('funcAchievement').classList.add('active'); if(!window._achievementLoaded){ loadAchievementModule(); window._achievementLoaded = true; } }
  else if(id === 'community'){ document.getElementById('funcCommunity').classList.add('active'); if(!window._communityLoaded){ loadCommunityModule(); window._communityLoaded = true; } }
  else if(id === 'diary'){ document.getElementById('funcDiary').classList.add('active'); if(!window._diaryLoaded){ loadDiaryModule(); window._diaryLoaded = true; } }
  else if(id === 'work'){ document.getElementById('funcWork').classList.add('active'); if(!window._workLoaded){ loadWorkModule(); window._workLoaded = true; } }
  else if(id === 'recipe'){ document.getElementById('funcRecipe').classList.add('active'); if(!window._recipeLoaded){ loadRecipeModule(); window._recipeLoaded = true; } }
  else { alert('这个功能还在开发中~'); goHome(); }
}
function goHome(){ document.getElementById('homePage').style.display = 'block'; document.getElementById('topBar').style.display = 'flex'; document.querySelectorAll('.func-page').forEach(p => p.classList.remove('active')); }

// ==================== 周期手账模块 ====================
function loadPeriodModule(){
  document.getElementById('periodContent').innerHTML = `<div class="app-card" id="appCard"><h2>🌸 周期手账</h2><div style="display:flex;justify-content:center;gap:6px;"><button id="changeBgBtn" style="background:var(--bg-elevated);border:1px solid var(--border);padding:6px 12px;border-radius:16px;font-size:0.7rem;font-weight:bold;cursor:pointer;color:var(--text-secondary);">🖼 换背景</button><button id="resetBgBtn" style="background:var(--bg-elevated);border:1px solid var(--border);padding:6px 12px;border-radius:16px;font-size:0.7rem;font-weight:bold;cursor:pointer;color:var(--text-secondary);">↩ 恢复</button><input type="file" id="bgFileInput" accept="image/*" style="display:none;"></div><div class="month-header"><button class="month-nav" id="prevMonth">◀</button><span id="monthLabel"></span><button class="month-nav" id="nextMonth">▶</button></div><div class="calendar-grid" id="calendarHead"></div><div class="calendar-grid" id="calendarBody"></div><div class="legend"><span><span class="legend-dot" style="background:rgba(232,160,176,0.5);"></span>经期</span><span><span class="legend-dot" style="background:rgba(200,160,220,0.3); border:1px dashed rgba(200,160,220,0.5);"></span>预测</span><span><span class="legend-dot" style="background:rgba(100,200,180,0.3);"></span>排卵期</span><span><span class="legend-dot" style="background:rgba(100,200,180,0.5);"></span>排卵日</span><span><span class="legend-dot" style="background:rgba(201,168,76,0.2);"></span>黄体期</span><span><span class="legend-dot" style="background:rgba(232,160,176,0.2);"></span>亲密</span></div><div class="hint-text" id="cycleHint"></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><strong id="modalDateTitle"></strong><div class="toggle-row" id="periodToggle"><span style="color:var(--text-secondary);">🩸 标记为经期</span><div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div></div><div class="hint-text" id="periodHint"></div><div class="modal-row"><span style="color:var(--text-secondary);">😣 肚子：</span><span id="painEmojis"></span></div><div class="modal-row"><span style="color:var(--text-secondary);">🩸 血量：</span><span id="flowEmojis"></span></div><div class="modal-row"><span style="color:var(--text-secondary);">💕 亲密：</span><span id="intimacyTags"><span class="intimacy-tag" data-val="none">无</span><span class="intimacy-tag" data-val="condom">🍥戴套</span><span class="intimacy-tag" data-val="pill">💊吃药</span><span class="intimacy-tag" data-val="outside">🚫体外</span><span class="intimacy-tag" data-val="other">❓其他</span></span></div><textarea id="modalNote" placeholder="备注……" rows="2" style="width:100%; border-radius:12px; padding:6px; resize:none; font-size:0.8rem;"></textarea><div class="modal-row"><label style="background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);padding:6px 10px;border-radius:12px;font-size:0.7rem;cursor:pointer;" for="imageUpload">📷 配图</label><input type="file" id="imageUpload" accept="image/*" style="display:none;"><span id="imagePreview" style="font-size:0.7rem;cursor:pointer;color:var(--text-secondary);"></span></div><div style="display:flex;gap:4px;"><button class="btn btn-delete" id="modalDelete">🗑 删除</button><button class="btn btn-close" id="modalClose">关闭</button></div></div></div><div class="image-modal" id="imageModal"><img id="largeImage" src="" alt="大图"><button class="close-img-btn" id="closeImageBtn">关闭</button></div>`;
  (function(){
    const STORAGE_CYCLE='cycle_v5_',STORAGE_SETTINGS='cycle_settings_v5';
    function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function addDays(ds,n){ const d=new Date(ds); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function dateCompare(a,b){ return new Date(a)-new Date(b); }
    function getData(ds){ const r=localStorage.getItem(STORAGE_CYCLE+ds); return r?JSON.parse(r):{isPeriod:false,pain:'',flow:'',intimacy:'none',note:'',image:''}; }
    function setData(ds,obj){ localStorage.setItem(STORAGE_CYCLE+ds,JSON.stringify(obj)); }
    function delData(ds){ localStorage.removeItem(STORAGE_CYCLE+ds); }
    function getSettings(){ const r=localStorage.getItem(STORAGE_SETTINGS); return r?JSON.parse(r):{cycleLength:28,periodLength:5,lastPeriodStart:null,lutealLength:14}; }
    function saveSettings(s){ localStorage.setItem(STORAGE_SETTINGS,JSON.stringify(s)); }
    let calYear,calMonth; const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth()+1;
    const monthLabel=document.getElementById('monthLabel'),calHead=document.getElementById('calendarHead'),calBody=document.getElementById('calendarBody'),cycleHint=document.getElementById('cycleHint');
    function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
    function getPredictions(year,month){ const s=getSettings(); const res={predicted:[],fertile:[],ovulation:[],luteal:[]}; if(!s.lastPeriodStart) return res; const plen=s.periodLength||5,clen=s.cycleLength||28,llen=s.lutealLength||14; let ns=new Date(s.lastPeriodStart); ns.setDate(ns.getDate()-clen*3); for(let i=0;i<12;i++){ ns.setDate(ns.getDate()+clen); const ss=`${ns.getFullYear()}-${String(ns.getMonth()+1).padStart(2,'0')}-${String(ns.getDate()).padStart(2,'0')}`; for(let j=0;j<plen;j++){ const pd=addDays(ss,j); const [py,pm]=pd.split('-').map(Number); if(py===year&&pm===month) res.predicted.push(parseInt(pd.split('-')[2])); } const ovDate=addDays(ss,-llen); const [oy,om,od]=ovDate.split('-').map(Number); if(oy===year&&om===month) res.ovulation.push(od); let fc=addDays(ovDate,-5); while(dateCompare(fc,ovDate)<=0){ const [fy,fm,fd]=fc.split('-').map(Number); if(fy===year&&fm===month) res.fertile.push(fd); fc=addDays(fc,1); } let lc=addDays(ovDate,1),le=addDays(ss,-1); while(dateCompare(lc,le)<=0){ const [ly,lm,ld]=lc.split('-').map(Number); if(ly===year&&lm===month) res.luteal.push(ld); lc=addDays(lc,1); } } const hasRecord=Array.from({length:daysInMonth(year,month)},(_,i)=>i+1).some(d=>getData(`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`).isPeriod); if(hasRecord) res.predicted=[]; return res; }

  function loadPosts(){ const r=localStorage.getItem(STORAGE_POSTS); return r?JSON.parse(r):[]; } function savePosts(arr){ localStorage.setItem(STORAGE_POSTS,JSON.stringify(arr)); }
  function countAllReplies(replies){ if(!replies) return 0; let count = replies.length; replies.forEach(r => { if(r.replies) count += r.replies.length; }); return count; }
  function renderPostList(){ const posts = loadPosts(); const container = document.getElementById('postList'); if(posts.length === 0){ container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">✨ 还没有帖子，发一个吧</div>'; return; } container.innerHTML = posts.map((p,i) => `<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;position:relative;" data-index="${i}"><div style="font-weight:bold;color:var(--text-primary);margin-bottom:4px;padding-right:20px;">${p.title}</div><div style="font-size:0.8rem;color:var(--text-secondary);white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;max-height:60px;">${p.content}</div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:0.65rem;color:var(--text-muted);"><span>${p.time} · ${countAllReplies(p.replies)} 评论</span><button class="deletePostBtn" data-index="${i}" style="background:transparent;border:none;color:rgba(232,160,176,0.7);font-size:0.6rem;cursor:pointer;">🗑 删除</button></div></div>`).join(''); container.querySelectorAll('[data-index]').forEach(item=>{ item.addEventListener('click', function(e){ if(e.target.classList.contains('deletePostBtn')) return; currentPostIndex = parseInt(this.getAttribute('data-index')); showDetail(currentPostIndex); }); }); container.querySelectorAll('.deletePostBtn').forEach(btn=>{ btn.addEventListener('click', function(e){ e.stopPropagation(); const index = parseInt(this.getAttribute('data-index')); if(confirm('确定删除这个帖子吗？')){ const posts = loadPosts(); posts.splice(index, 1); savePosts(posts); renderPostList(); } }); }); }
  function showDetail(index){ const posts = loadPosts(); const post = posts[index]; document.getElementById('communityMainView').style.display = 'none'; document.getElementById('communityDetailView').style.display = 'block'; document.getElementById('detailContent').innerHTML = `<div style="font-weight:bold;color:var(--text-primary);font-size:1.1rem;margin-bottom:8px;">${post.title}</div><div style="color:var(--text-secondary);white-space:pre-wrap;margin-bottom:8px;">${post.content}</div><div style="font-size:0.65rem;color:var(--text-muted);">${post.time}</div>`; renderReplies(); }
  function renderReplies(){ const posts = loadPosts(); const post = posts[currentPostIndex]; const container = document.getElementById('replyList'); if(!post.replies || post.replies.length === 0){ container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:10px;">暂无评论</div>'; return; } const flatReplies = []; function flatten(replies, path){ replies.forEach((r, i) => { flatReplies.push({...r, path: [...path, i]}); if(r.replies) flatten(r.replies, [...path, i]); }); } flatten(post.replies, []); container.innerHTML = flatReplies.map((r) => { const depth = r.path.length - 1; const indent = Math.min(depth * 8, 40); const prefix = depth > 0 ? `<span style="color:var(--gold-dim);font-size:0.65rem;">↳ </span>` : ''; return `<div style="margin-left:${indent}px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:12px;"><div style="color:var(--text-secondary);white-space:pre-wrap;font-size:0.85rem;">${prefix}${r.content}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;"><span style="font-size:0.6rem;color:var(--text-muted);">${r.time}</span><div style="display:flex;gap:6px;"><button class="subReplyBtn" data-path='${JSON.stringify(r.path)}' style="background:transparent;border:none;color:var(--gold-dim);font-size:0.65rem;cursor:pointer;">回复</button><button class="deleteReplyBtn" data-path='${JSON.stringify(r.path)}' style="background:transparent;border:none;color:rgba(232,160,176,0.7);font-size:0.6rem;cursor:pointer;">🗑</button></div></div></div>`; }).join(''); document.querySelectorAll('.subReplyBtn').forEach(btn=>{ btn.addEventListener('click', function(e){ e.stopPropagation(); currentReplyPath = JSON.parse(this.getAttribute('data-path')); document.getElementById('subReplyInput').value = ''; document.getElementById('subReplyModal').classList.add('show'); }); }); document.querySelectorAll('.deleteReplyBtn').forEach(btn=>{ btn.addEventListener('click', function(e){ e.stopPropagation(); const path = JSON.parse(this.getAttribute('data-path')); if(confirm('确定删除这条评论吗？')){ const posts = loadPosts(); const replies = posts[currentPostIndex].replies; deleteByPath(replies, path); savePosts(posts); renderReplies(); } }); }); }
  function deleteByPath(replies, path){ if(path.length === 1){ replies.splice(path[0], 1); return; } const [first, ...rest] = path; if(replies[first] && replies[first].replies){ deleteByPath(replies[first].replies, rest); } }
  function getReplyByPath(replies, path){ let target = replies; for(let i=0; i<path.length; i++){ if(!target[path[i]]) return null; if(i < path.length-1){ if(!target[path[i]].replies) target[path[i]].replies = []; target = target[path[i]].replies; } } return target[path.length-1]; }
  document.getElementById('backToListBtn').addEventListener('click', ()=>{ document.getElementById('communityDetailView').style.display = 'none'; document.getElementById('communityMainView').style.display = 'block'; renderPostList(); });
  document.getElementById('newPostBtn').addEventListener('click', ()=>{ document.getElementById('postTitleInput').value = ''; document.getElementById('postContentInput').value = ''; document.getElementById('postEditModal').classList.add('show'); });
  document.getElementById('savePostBtn').addEventListener('click', ()=>{ const title = document.getElementById('postTitleInput').value.trim(); const content = document.getElementById('postContentInput').value.trim(); if(!title) return alert('标题不能为空'); const posts = loadPosts(); posts.unshift({title, content, time: new Date().toLocaleString(), replies:[]}); savePosts(posts); document.getElementById('postEditModal').classList.remove('show'); renderPostList(); });
  document.getElementById('cancelPostBtn').addEventListener('click', ()=> document.getElementById('postEditModal').classList.remove('show')); document.getElementById('postEditModal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
  document.getElementById('submitReplyBtn').addEventListener('click', ()=>{ const reply = document.getElementById('newReplyInput').value.trim(); if(!reply) return alert('回复不能为空'); const posts = loadPosts(); if(currentPostIndex !== null && posts[currentPostIndex]){ if(!posts[currentPostIndex].replies) posts[currentPostIndex].replies = []; posts[currentPostIndex].replies.push({content:reply, time: new Date().toLocaleString(), replies:[]}); savePosts(posts); } document.getElementById('newReplyInput').value = ''; renderReplies(); });
  document.getElementById('saveSubReplyBtn').addEventListener('click', ()=>{ const reply = document.getElementById('subReplyInput').value.trim(); if(!reply) return alert('回复不能为空'); const posts = loadPosts(); if(currentPostIndex !== null && currentReplyPath !== null && posts[currentPostIndex]){ const target = getReplyByPath(posts[currentPostIndex].replies, currentReplyPath); if(target){ if(!target.replies) target.replies = []; target.replies.push({content:reply, time: new Date().toLocaleString(), replies:[]}); savePosts(posts); } } document.getElementById('subReplyModal').classList.remove('show'); renderReplies(); });
  document.getElementById('cancelSubReplyBtn').addEventListener('click', ()=> document.getElementById('subReplyModal').classList.remove('show')); document.getElementById('subReplyModal').addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); });
  renderPostList();
}

function getUnlocked(){ const r=localStorage.getItem('my_achievements'); return r?JSON.parse(r):{}; }
function saveUnlocked(obj){ localStorage.setItem('my_achievements',JSON.stringify(obj)); }
function unlockAchievement(id){ const unlocked = getUnlocked(); if(unlocked[id]) return; unlocked[id] = new Date().toLocaleString(); saveUnlocked(unlocked); const ach = ACHIEVEMENTS.find(a=>a.id===id); if(ach) triggerAchievement(ach.icon, ach.name, ach.desc); }
window.triggerAchievement = function(icon, name, desc){ const toast = document.getElementById('achieveToast'); if(!toast) return; document.getElementById('achieveToastIcon').textContent = icon; document.getElementById('achieveToastName').textContent = name; document.getElementById('achieveToastDesc').textContent = desc; toast.classList.add('show'); playAchieveSound(); setTimeout(()=>{ toast.classList.remove('show'); }, 4000); };
function playAchieveSound(){ try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); [523,659,784,1047].forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine';o.frequency.value=f; g.gain.setValueAtTime(0.15,ctx.currentTime+i*0.12); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.2); o.connect(g);g.connect(ctx.destination); o.start(ctx.currentTime+i*0.12);o.stop(ctx.currentTime+i*0.12+0.25); }); }catch(e){} }
function loadAchievementModule(){ document.getElementById('achievementContent').innerHTML = `<div class="app-card"><h2>🏅 成就库</h2><div id="achieveList"></div></div>`; renderAchievements(); }
function renderAchievements(){ const unlocked = getUnlocked(); const cats = ['打工','经期','菜谱','日记','隐藏']; let html = ''; cats.forEach(cat => { const items = ACHIEVEMENTS.filter(a=>a.cat===cat); html += `<div style="color:var(--gold-light);font-weight:bold;margin:12px 0 6px;font-size:0.85rem;">${cat}</div><div class="achieve-grid">`; items.forEach(a => { const isUnlocked = !!unlocked[a.id]; html += `<div class="achieve-card${isUnlocked?'':' locked'}"><div class="ach-icon">${a.icon}</div><div class="ach-name">${a.name}</div><div class="ach-cond">${a.desc}</div>${isUnlocked?`<div class="ach-date">${unlocked[a.id]}</div>`:''}</div>`; }); html += '</div>'; }); document.getElementById('achieveList').innerHTML = html; }
