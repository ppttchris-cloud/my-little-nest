  <title>我的小窝</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:'PingFang SC','Microsoft YaHei',sans-serif; }
    body { background:#f5efe0; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:16px; margin:0; }
    .app-frame { width:100%; max-width:420px; height:85vh; max-height:750px; background:#fffef7; border-radius:40px; box-shadow:0 20px 35px rgba(0,0,0,0.15); overflow:hidden; display:flex; flex-direction:column; border:3px solid #e6d7b8; position:relative; }

    /* 窗帘样式 */
.curtain-handle { width:60px; height:14px; background:#d9b382; border-radius:0 0 14px 14px; margin:0 auto; cursor:pointer; z-index:50; position:absolute; top:0; left:50%; transform:translateX(-50%); transition:top 0.3s; box-shadow:0 2px 6px rgba(0,0,0,0.15); display:flex; align-items:center; justify-content:center; font-size:0.6rem; color:white; }
    .curtain-panel { position:absolute; top:-100%; left:0; width:100%; height:60%; background:#fffef7; z-index:40; border-radius:0 0 30px 30px; box-shadow:0 10px 25px rgba(0,0,0,0.1); transition:top 0.3s ease; padding:30px 16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .curtain-panel.open { top:0; }

    .curtain-item { display:flex; align-items:center; gap:10px; padding:8px; background:#fdf9f2; border-radius:12px; cursor:grab; }
    .curtain-item:active { cursor:grabbing; }
    .curtain-item.checked { opacity:0.5; }

    .curtain-item.checked .curtain-checkbox { background:#b3925c; border-color:#b3925c; }

    .top-bar { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 8px; flex-shrink:0; }

    .money-display { background:#e8f5e9; border-radius:24px; padding:24px; }

<body>
<div class="app-frame" id="appFrame">
  <!-- 窗帘组件 -->
  <div class="curtain-handle" id="curtainHandle"></div>
  <div class="curtain-panel" id="curtainPanel">
    <h4 style="text-align:center; color:#5a4530;">📋 待办清单</h4>
    <div id="curtainList"></div>
  </div>

  <div class="top-bar" id="topBar">
<h2 id="topTitle" style="cursor:pointer;" onclick="editTitle()">🏠 我的小窝 <span style="font-size:0.7rem;">✏️</span></h2>
<button class="mode-toggle" id="modeToggle">🔄 J人模式</button>
  </div>
  <div class="page-area" id="homePage">
    <div class="j-list" id="jListView"></div>
    <div class="p-grid" id="pGridView" style="display:none;"></div>
  </div>
  <div class="func-page" id="funcPeriod">
    <div class="func-header"><button class="back-btn" onclick="goHome()">← 返回</button><span style="font-weight:bold;">🌸 周期手账</span></div>
    <div class="func-content" id="periodContent"></div>
  </div>
  <div class="func-page" id="funcMood">
    <div class="func-header"><button class="back-btn" onclick="goHome()">← 返回</button><span style="font-weight:bold;">📓 心情日记</span></div>
    <div class="func-content" id="moodContent"></div>
  </div>
  <div class="func-page" id="funcRecipe">
    <div class="func-header"><button class="back-btn" onclick="goHome()">← 返回</button><span style="font-weight:bold;">🍳 菜谱选购</span></div>
    <div class="func-content" id="recipeContent"></div>
  </div>
  <div class="func-page" id="funcWork">
    <div class="func-header"><button class="back-btn" onclick="goHome()">← 返回</button><span style="font-weight:bold;">💰 钱钱钱</span></div>
    <div class="func-content" id="workContent"></div>
  </div>
</div>

<script>
// ==================== 全局待办聚合 ====================
function getCurtainItems() {
  const items = [];
  const cart = JSON.parse(localStorage.getItem('my_menu_cart') || '{}');
  const menu = JSON.parse(localStorage.getItem('my_menu_data') || '[]');
  const receipts = JSON.parse(localStorage.getItem('my_receipt_checked') || '{}');
  
  const ingredientCounts = {};
  Object.keys(cart).forEach(index => {
    const dish = menu[parseInt(index)];
    const qty = cart[index] || 1;
    if (dish) {
      dish.ingredients.forEach(ing => {
        ingredientCounts[ing] = (ingredientCounts[ing] || 0) + qty;
      });
    }
  });
  Object.keys(ingredientCounts).forEach(ing => {
    const key = `ing_${ing}`;
    if (!receipts[key]) {
      const count = ingredientCounts[ing];
      items.push({ id: key, text: `🛒 ${ing}${count > 1 ? ' x' + count : ''}`, source: 'recipe' });
    }
  });

  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const periodData = JSON.parse(localStorage.getItem('cycle_v5_' + dateStr) || '{}');
  if (periodData.note) {
    items.push({ id: 'period_note', text: `📝 ${periodData.note}`, source: 'period' });
  }

  const savedOrder = JSON.parse(localStorage.getItem('my_curtain_order') || '[]');
  if (savedOrder.length > 0) {
    items.sort((a, b) => {
      const aIdx = savedOrder.indexOf(a.id);
      const bIdx = savedOrder.indexOf(b.id);
      if (aIdx === -1) return 1;
      if (bIdx === -1) return -1;
      return aIdx - bIdx;
    });
  }

  return items;
}

let curtainOpen = false;
const curtainPanel = document.getElementById('curtainPanel');
const curtainHandle = document.getElementById('curtainHandle');

function toggleCurtain() {
  curtainOpen = !curtainOpen;
  if (curtainOpen) {
    curtainPanel.classList.add('open');
    curtainHandle.classList.add('open');
    renderCurtain();
  } else {
    curtainPanel.classList.remove('open');
    curtainHandle.classList.remove('open');
  }
}

curtainHandle.addEventListener('click', toggleCurtain);
curtainPanel.addEventListener('click', function(e) { e.stopPropagation(); });
document.getElementById('appFrame').addEventListener('click', function(e) {
  if (curtainOpen && !curtainPanel.contains(e.target) && e.target !== curtainHandle) {
    toggleCurtain();
  }
});

function renderCurtain() {
  const items = getCurtainItems();
  const list = document.getElementById('curtainList');
  if (items.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#9b896c;padding:20px;">✨ 暂无待办，去逛逛吧</div>';
    return;
  }
list.innerHTML = items.map((item, index) => `

Each(i=>{ const d=menuData[parseInt(i)]; const qty=selectedDishes[i]||1; if(d) d.ingredients.forEach(ing=>{ for(let n=0;n<qty;n++) all.push(ing); }); }); const counts={}; all.forEach(ing=>{ counts[ing]=(counts[ing]||0)+1; }); const unique=Object.keys(counts).map(ing=>counts[ing]>1?`${ing} x${counts[ing]}`:ing); document.getElementById('receiptList').innerHTML=unique.map(ing=>`<div class="receipt-item" data-ing="${ing.split(' x')[0]}"><div class="check-box"></div><span>${ing}</span></div>`).join(''); document.querySelectorAll('.receipt-item').forEach(item=>{ item.addEventListener('click',function(){ this.classList.toggle('checked'); }); }); } function openEditor(index){ editingIndex=index; const dish=index>=0?menuData[index]:null; document.getElementById('editTitle').textContent=index>=0?'编辑菜品':'添加新菜'; document.getElementById('editName').value=dish?dish.name:''; document.getElementById('editCategory').value=dish?dish.category:'荤菜'; document.getElementById('editIngredients').value=dish?dish.ingredients.join(','):''; document.getElementById('editImagePreview').textContent=dish&&dish.image?'✅ 已有图':''; tempImageData=dish?dish.image||'':''; document.getElementById('deleteDishBtn').style.display=index>=0?'inline-block':'none'; document.getElementById('editModal').classList.add('show'); } document.getElementById('addDishHeaderBtn').addEventListener('click',()=>openEditor(-1)); document.getElementById('editImage').addEventListener('change',function(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){ tempImageData=ev.target.result; document.getElementById('editImagePreview').textContent='✅ 已选图'; }; r.readAsDataURL(f); }); document.getElementById('saveDishBtn').addEventListener('click',function(){ const name=document.getElementById('editName').value.trim(); if(!name) return alert('菜名不能为空'); const category=document.getElementById('editCategory').value; const raw=document.getElementById('editIngredients').value.trim(); const ingredients=raw?raw.split(/[,，]/).map(s=>s.trim()).filter(s=>s):[]; let finalImage=tempImageData; if(tempImageData&&tempImageData.length>200000){ const img=new Image(); img.src=tempImageData; img.onload=function(){ const canvas=document.createElement('canvas'); const maxW=300; const scale=maxW/img.width; canvas.width=maxW; canvas.height=img.height*scale; const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,canvas.width,canvas.height); finalImage=canvas.toDataURL('image/jpeg',0.6); saveDish(finalImage); }; return; } saveDish(finalImage); function saveDish(img){ const dish={name,category,ingredients,image:img}; if(editingIndex>=0) menuData[editingIndex]=dish; else menuData.push(dish); saveMenu(); document.getElementById('editModal').classList.remove('show'); renderCategories(); renderDishes(); } }); document.getElementById('deleteDishBtn').addEventListener('click',function(){ if(editingIndex>=0&&confirm('确定删除这道菜吗？')){ delete selectedDishes[editingIndex]; menuData.splice(editingIndex,1); saveMenu(); saveCart(); document.getElementById('editModal').classList.remove('show'); renderCategories(); renderDishes(); updateCartInfo(); } }); document.getElementById('cancelEditBtn').addEventListener('click',()=>{ document.getElementById('editModal').classList.remove('show'); }); document.getElementById('editModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); }); document.getElementById('viewListBtn').addEventListener('click',()=>{ renderReceipt(); document.getElementById('receiptModal').classList.add('show'); }); document.getElementById('closeReceiptBtn').addEventListener('click',()=>{ document.getElementById('receiptModal').classList.remove('show'); }); document.getElementById('receiptModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); }); loadMenu(); loadCart(); renderCategories(); renderDishes(); updateCartInfo(); })();

||''; document.getElementById('moodEditDate').textContent=ds; document.getElementById('moodNoteInput').value=data.note||''; document.getElementById('moodImagePreview').textContent=curMoodImg?'✅ 已选图':''; document.getElementById('moodImagePreview').style.cursor=curMoodImg?'pointer':'default'; document.getElementById('moodImageUpload').value=''; renderEmojis(); editPanel.style.display='block'; } function renderEmojis(){ const grid=document.getElementById('moodEmojiGrid'); grid.innerHTML=moodList.map(e=>`<span class="modal-emoji${curMood===e?' selected':''}" data-v="${e}">${e}</span>`).join(''); grid.querySelectorAll('.modal-emoji').forEach(el=>{ el.addEventListener('click',function(){ const v=this.getAttribute('data-v'); curMood=curMood===v?null:v; renderEmojis(); }); }); } document.getElementById('moodPrevMonth').addEventListener('click',()=>{ moodCalMonth--; if(moodCalMonth<1){moodCalMonth=12;moodCalYear--;} renderCalendar(); editPanel.style.display='none'; }); document.getElementById('moodNextMonth').addEventListener('click',()=>{ moodCalMonth++; if(moodCalMonth>12){moodCalMonth=1;moodCalYear++;} renderCalendar(); editPanel.style.display='none'; }); document.getElementById('saveMoodBtn').addEventListener('click',function(){ if(!selectedDate) return; saveData(selectedDate,{mood:curMood,note:document.getElementById('moodNoteInput').value.trim(),image:curMoodImg}); editPanel.style.display='none'; renderCalendar(); }); document.getElementById('deleteMoodBtn').addEventListener('click',function(){ if(!selectedDate) return; if(confirm('确定删除吗？')){ delData(selectedDate); editPanel.style.display='none'; curMood=null; curMoodImg=''; renderCalendar(); } }); document.getElementById('cancelEditBtn').addEventListener('click',function(){ editPanel.style.display='none'; }); document.getElementById('moodImageUpload').addEventListener('change',function(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=function(ev){ curMoodImg=ev.target.result; document.getElementById('moodImagePreview').textContent='✅ 已选图'; document.getElementById('moodImagePreview').style.cursor='pointer'; }; r.readAsDataURL(f); }); document.getElementById('moodImagePreview').addEventListener('click',function(){ if(curMoodImg){ document.getElementById('moodLargeImage').src=curMoodImg; document.getElementById('moodImageModal').classList.add('show'); } }); document.getElementById('moodCloseImageBtn').addEventListener('click',function(){ document.getElementById('moodImageModal').classList.remove('show'); }); document.getElementById('moodImageModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); }); renderCalendar(); })();

// ==================== 打工续命模块 ====================
function loadWorkModule(){
  document.getElementById('workContent').innerHTML = `
    <div class="work-card">
      <h2>💰 钱钱钱</h2>
      <div class="money-display" id="moneyDisplay">
        <small id="moneyLabel">今天已赚（估算）</small>
        <div class="big-number" id="moneyValue">¥0.0000</div>
        <div class="toggle-row">
          <button class="toggle-btn active" data-mode="today">今天</button>
          <button class="toggle-btn" data-mode="hour">时薪</button>
          <button class="toggle-btn" data-mode="month">月薪</button>
          <button class="toggle-btn" data-mode="year">年薪</button>
        </div>
      </div>
      <div class="time-section">
        <div class="time-row">
          <div class="time-box"><label>上班打卡</label><input type="time" id="startTimeInput" value=""></div>
          <div class="time-box"><label>下班打卡</label><input type="time" id="endTimeInput" value=""></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn-work" id="clockInBtn" style="flex:1;">🏃 上班</button>
          <button class="btn-work secondary" id="clockOutBtn" style="flex:1;">🏁 下班</button>
          <button class="btn-work secondary" id="clearTodayBtn" style="padding:14px 16px;">🗑</button>
        </div>
      </div>
      <div class="info-section">
        <div class="info-row"><span>已上班</span><span id="workedTime">--</span></div>
        <div class="info-row"><span>距下班</span><span id="untilOff">--</span></div>
        <div class="info-row"><span>本月已赚</span><span id="monthlyTotal">¥0.00</span></div>
        <div class="info-row" id="weekendSettingRow" style="cursor:pointer;"><span>距周末</span><span id="untilWeekend">--</span></div>
        <div class="info-row"><span>距发薪</span><span id="untilPayday">--</span></div>
      </div>
      <div class="settings-section">
        <div class="setting-row"><label>上班时间</label><input type="time" id="setStart" value="09:00"></div>
        <div class="setting-row"><label>下班时间</label><input type="time" id="setEnd" value="18:00"></div>
        <div class="setting-row"><label>月薪</label><input type="number" id="monthlySalary" value="8000" step="100" min="100"></div>
        <div class="setting-row"><label>发薪日</label><input type="number" id="paydayInput" value="10" min="1" max="31"></div>
      </div>
    </div>
  `;
  (function(){
    const moneyValue = document.getElementById('moneyValue');
    const moneyLabel = document.getElementById('moneyLabel');
    const startInput = document.getElementById('startTimeInput');
    const endInput = document.getElementById('endTimeInput');
    const setStart = document.getElementById('setStart');
    const setEnd = document.getElementById('setEnd');
    const salaryInput = document.getElementById('monthlySalary');
    const paydayInput = document.getElementById('paydayInput');
    const monthlyTotalEl = document.getElementById('monthlyTotal');
    const untilWeekendEl = document.getElementById('untilWeekend');
    let timer = null, clockedIn = false, startActual = null, currentMode = 'today';
    let restDays = JSON.parse(localStorage.getItem('restDays') || '[0,6]'); // 默认双休

    if(localStorage.getItem('workStart')) setStart.value = localStorage.getItem('workStart');
    if(localStorage.getItem('workEnd')) setEnd.value = localStorage.getItem('workEnd');
    if(localStorage.getItem('monthlySalary')) salaryInput.value = localStorage.getItem('monthlySalary');
    if(localStorage.getItem('payday')) paydayInput.value = localStorage.getItem('payday');
    setStart.addEventListener('change', ()=> { localStorage.setItem('workStart', setStart.value); if(clockedIn) resetTimer(); });
    setEnd.addEventListener('change', ()=> { localStorage.setItem('workEnd', setEnd.value); if(clockedIn) resetTimer(); });
    salaryInput.addEventListener('change', ()=> localStorage.setItem('monthlySalary', salaryInput.value));
    paydayInput.addEventListener('change', ()=> localStorage.setItem('payday', paydayInput.value));

    // 点击“距周末”设置休息日
    document.getElementById('weekendSettingRow').addEventListener('click', ()=>{
      const current = restDays.includes(6) && restDays.includes(0) ? '双休' : restDays.includes(6) ? '单休（周日上班）' : restDays.includes(0) ? '单休（周六上班）' : '无休';
      const choice = prompt(`当前：${current}\n输入数字设置休息日：\n0 = 双休\n1 = 单休（周六上班）\n2 = 单休（周日上班）\n3 = 无休`, restDays.includes(6)&&restDays.includes(0)?'0':restDays.includes(6)?'1':restDays.includes(0)?'2':'3');
      if(choice === '0') restDays = [0,6];
      else if(choice === '1') restDays = [0];
      else if(choice === '2') restDays = [6];
      else if(choice === '3') restDays = [];
      else return;
      localStorage.setItem('restDays', JSON.stringify(restDays));
      updateInfo();
    });

    function getWage() {
      const monthlySalary = parseFloat(salaryInput.value) || 8000;
      const [startH, startM] = setStart.value.split(':').map(Number);
      const [endH, endM] = setEnd.value.split(':').map(Number);
      const workHoursPerDay = (endH + endM/60) - (startH + startM/60);
      const workDaysPerMonth = 22; // 默认22天
      return workHoursPerDay > 0 ? monthlySalary / (workHoursPerDay * workDaysPerMonth) : 0;
    }

    function getMonthlyTotal() {
      const records = JSON.parse(localStorage.getItem('work_records') || '{}');
      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      return records[monthKey] || 0;
    }

    function addMonthlyTotal(amount) {
      const records = JSON.parse(localStorage.getItem('work_records') || '{}');
      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      records[monthKey] = (records[monthKey] || 0) + amount;
      localStorage.setItem('work_records', JSON.stringify(records));
    }

    function updateMonthlyDisplay() {
      const total = getMonthlyTotal();
      monthlyTotalEl.textContent = `¥${total.toFixed(2)}`;
    }

    function resetTimer() {
      if (timer) clearInterval(timer);
      if (clockedIn) timer = setInterval(updateDisplay, 100);
      updateDisplay();
    }

    function updateInfo() {
      const now = new Date();
      if (startActual && clockedIn) {
        const diffMs = now - startActual;
        if (diffMs > 0) {
          const h = Math.floor(diffMs / 3600000);
          const m = Math.floor((diffMs % 3600000) / 60000);
          document.getElementById('workedTime').textContent = `${h}小时${m}分钟`;
        }
        const [endH, endM] = setEnd.value.split(':').map(Number);
        const endActual = new Date(); endActual.setHours(endH, endM, 0, 0);
        const remainMs = endActual - now;
        if (remainMs > 0) {
          const rh = Math.floor(remainMs / 3600000);
          const rm = Math.floor((remainMs % 3600000) / 60000);
          document.getElementById('untilOff').textContent = `${rh}小时${rm}分钟`;
        } else { document.getElementById('untilOff').textContent = '已下班'; }
      } else {
        document.getElementById('workedTime').textContent = '--';
        document.getElementById('untilOff').textContent = '--';
      }
      const dayOfWeek = now.getDay();
      let daysUntilWeekend = 0;
      if (restDays.length === 0) {
        daysUntilWeekend = -1; // 无休
      } else {
        for (let i = 0; i < 7; i++) {
          const checkDay = (dayOfWeek + i) % 7;
          if (restDays.includes(checkDay)) {
            daysUntilWeekend = i;
            break;
          }
        }
      }
      if (daysUntilWeekend === 0 && restDays.includes(dayOfWeek)) {
        untilWeekendEl.textContent = '休息中🎉';
      } else if (daysUntilWeekend === -1) {
        untilWeekendEl.textContent = '无休😢';
      } else {
        untilWeekendEl.textContent = `${daysUntilWeekend}天`;
      }
      const payday = parseInt(paydayInput.value) || 10;
      const today = now.getDate();
      let daysUntilPay = payday - today;
      if (daysUntilPay < 0) daysUntilPay += new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
      document.getElementById('untilPayday').textContent = daysUntilPay === 0 ? '今天发薪💰' : `${daysUntilPay}天`;
    }

    function updateDisplay() {
      const wage = getWage();
      const monthlySalary = parseFloat(salaryInput.value) || 8000;
      if (currentMode === 'today' && clockedIn && startActual) {
        const now = new Date();
        const endActual = new Date();
        const [endH, endM] = setEnd.value.split(':').map(Number);
        endActual.setHours(endH, endM, 0, 0);
        const effectiveEnd = now > endActual ? endActual : now;
        const diffMs = effectiveEnd - startActual;
        if (diffMs < 0) { moneyValue.textContent = '¥0.0000'; moneyLabel.textContent = '还没到上班时间'; return; }
        moneyValue.textContent = `¥${(diffMs / 3600000 * wage).toFixed(4)}`;
        moneyLabel.textContent = '今天已赚（估算）';
      } else if (currentMode === 'hour') {
        moneyValue.textContent = `¥${wage.toFixed(4)}`;
        moneyLabel.textContent = '每秒都在赚';
      } else if (currentMode === 'month') {
        moneyValue.textContent = `¥${monthlySalary.toLocaleString()}`;
        moneyLabel.textContent = '每月工资';
      } else if (currentMode === 'year') {
        moneyValue.textContent = `¥${(monthlySalary*12).toLocaleString()}`;
        moneyLabel.textContent = '每年预计收入';
      }
      updateInfo();
    }

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentMode = this.getAttribute('data-mode');
        updateDisplay();
      });
    });

    startInput.addEventListener('change', ()=>{
      if (startInput.value) {
        const [sh, sm] = startInput.value.split(':').map(Number);
        startActual = new Date(); startActual.setHours(sh, sm, 0, 0);
        clockedIn = true;
        resetTimer();
      }
    });

    endInput.addEventListener('change', ()=>{
      if (startInput.value && endInput.value && clockedIn) {
        const [eh, em] = endInput.value.split(':').map(Number);
        const endActual = new Date(); endActual.setHours(eh, em, 0, 0);
        const diffMs = endActual - startActual;
        const earned = diffMs / 3600000 * getWage();
        addMonthlyTotal(earned);
        updateMonthlyDisplay();
        clockedIn = false;
        if (timer) clearInterval(timer);
        updateDisplay();
        alert(`🎉 恭喜！今天已赚 ¥${earned.toFixed(2)}\n本月已赚 ¥${getMonthlyTotal().toFixed(2)}\n明天继续加油吧！`);
      }
    });

    document.getElementById('clockInBtn').addEventListener('click', ()=>{
      const now = new Date();
      startInput.value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      startActual = new Date(); startActual.setHours(now.getHours(), now.getMinutes(), 0, 0);
      clockedIn = true;
      endInput.value = '';
      moneyValue.textContent = '¥0.0000';
      moneyLabel.textContent = '今天已赚（估算）';
      resetTimer();
    });

    document.getElementById('clockOutBtn').addEventListener('click', ()=>{
      if (!clockedIn) return alert('还没打卡上班呢～');
      const now = new Date();
      endInput.value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const diffMs = now - startActual;
      const earned = diffMs / 3600000 * getWage();
      addMonthlyTotal(earned);
      updateMonthlyDisplay();
      clockedIn = false;
      if (timer) clearInterval(timer);
      updateDisplay();
      alert(`🎉 恭喜！今天已赚 ¥${earned.toFixed(2)}\n本月已赚 ¥${getMonthlyTotal().toFixed(2)}\n明天继续加油吧！`);
    });

    document.getElementById('clearTodayBtn').addEventListener('click', ()=>{
      if (confirm('确定清空今天的打卡记录吗？')) {
        clockedIn = false;
        startActual = null;
        startInput.value = '';
        endInput.value = '';
        moneyValue.textContent = '¥0.0000';
        moneyLabel.textContent = '今天已赚（估算）';
        document.getElementById('workedTime').textContent = '--';
        document.getElementById('untilOff').textContent = '--';
        if (timer) clearInterval(timer);
      }
    });

    updateMonthlyDisplay();
    updateDisplay();
  })();
}

function editTitle(){
  const newTitle = prompt('输入新名称：', document.getElementById('topTitle').textContent.replace('✏️','').trim());
  if(newTitle){
    document.getElementById('topTitle').innerHTML = newTitle + ' <span style="font-size:0.7rem;">✏️</span>';
    document.getElementById('topTitle').setAttribute('onclick','editTitle()');
    document.title = newTitle;
    localStorage.setItem('my_app_title', newTitle);
  }
}
(function(){
  const saved = localStorage.getItem('my_app_title');
  if(saved){
    document.getElementById('topTitle').innerHTML = saved + ' <span style="font-size:0.7rem;">✏️</span>';
    document.title = saved;
  }
})();
let dragSrcIndex = null;
function dragStart(e) { dragSrcIndex = parseInt(e.target.closest('.curtain-item').getAttribute('data-index')); e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function dropItem(e) { e.preventDefault(); const targetIndex = parseInt(e.target.closest('.curtain-item').getAttribute('data-index')); if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) { const items = getCurtainItems(); const draggedItem = items.splice(dragSrcIndex, 1)[0]; items.splice(targetIndex, 0, draggedItem); localStorage.setItem('my_curtain_order', JSON.stringify(items.map(i => i.id))); renderCurtain(); } dragSrcIndex = null; }
</script>
