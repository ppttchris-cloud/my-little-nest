<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的小窝</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      background: #f5efe0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
    }
    .app-frame {
      width: 100%;
      max-width: 420px;
      height: 85vh;
      max-height: 750px;
      background: #fffef7;
      border-radius: 40px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 3px solid #e6d7b8;
    }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
    }
    .top-bar h2 {
      font-size: 1.3rem;
      color: #5a4530;
      letter-spacing: 1px;
    }
    .mode-toggle {
      background: #f0e5d3;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      color: #5a4530;
    }

    /* 页面容器 */
    .page-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
    }

    /* J人模式：列表式 */
    .j-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .j-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fdf9f2;
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      border: 2px solid #ece0c8;
      transition: 0.1s;
    }
    .j-item:active {
      background: #f5ebd5;
    }
    .j-icon {
      font-size: 2rem;
      width: 48px;
      text-align: center;
    }
    .j-info {
      flex: 1;
    }
    .j-name {
      font-weight: bold;
      color: #4a3724;
      font-size: 1.1rem;
    }
    .j-desc {
      font-size: 0.75rem;
      color: #9b896c;
      margin-top: 2px;
    }
    .j-arrow {
      color: #c4a87c;
      font-size: 1.2rem;
    }

    /* P人模式：气泡飘散 */
    .p-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 0;
    }
    .p-bubble {
      background: #fdf9f2;
      border-radius: 28px;
      padding: 20px 16px;
      cursor: pointer;
      border: 2px solid #ece0c8;
      text-align: center;
      transition: 0.1s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
    .p-bubble:active {
      background: #f5ebd5;
      transform: scale(0.96);
    }
    .p-bubble.size-lg {
      width: 140px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .p-bubble.size-md {
      width: 110px;
      height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .p-bubble.size-sm {
      width: 90px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .p-icon {
      font-size: 2rem;
    }
    .p-name {
      font-weight: bold;
      font-size: 0.85rem;
      color: #4a3724;
    }

    /* 功能页面（隐藏） */
    .func-page {
      display: none;
      flex-direction: column;
      height: 100%;
    }
    .func-page.active {
      display: flex;
    }
    .func-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 12px;
    }
    .back-btn {
      background: #f0e5d3;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .func-content {
      flex: 1;
      overflow-y: auto;
    }
  </style>
</head>
<body>
<div class="app-frame">
  <!-- 顶部栏 -->
  <div class="top-bar" id="topBar">
    <h2 id="topTitle">🏠 我的小窝</h2>
    <button class="mode-toggle" id="modeToggle">🔄 J人模式</button>
  </div>

  <!-- 主页面区域 -->
  <div class="page-area" id="homePage">
    <div class="j-list" id="jListView"></div>
    <div class="p-grid" id="pGridView" style="display:none;"></div>
  </div>

  <!-- 功能页面：周期手账（占位） -->
  <div class="func-page" id="funcPeriod">
    <div class="func-header">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <span style="font-weight:bold;">🌸 周期手账</span>
    </div>
    <div class="func-content" id="periodContent">
      <p style="text-align:center; color:#999; padding:40px;">周期手账加载中...</p>
    </div>
  </div>

  <!-- 功能页面：菜谱选购（占位） -->
  <div class="func-page" id="funcRecipe">
    <div class="func-header">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <span style="font-weight:bold;">🍳 菜谱选购</span>
    </div>
    <div class="func-content" id="recipeContent">
      <p style="text-align:center; color:#999; padding:40px;">菜谱选购加载中...</p>
    </div>
  </div>
</div>

<script>
  // 功能列表
  const modules = [
    { id: 'period', name: '周期手账', icon: '🌸', desc: '经期记录、排卵预测', size: 'lg' },
    { id: 'recipe', name: '菜谱选购', icon: '🍳', desc: '选菜、生成采购清单', size: 'lg' },
    { id: 'mood', name: '心情日记', icon: '📓', desc: '每天记录心情', size: 'md' },
    { id: 'notes', name: '便签', icon: '📝', desc: '随手记灵感', size: 'sm' },
    { id: 'more', name: '更多', icon: '📦', desc: '即将上线', size: 'sm' }
  ];

  let isJMode = true;

  // 渲染J人列表
  function renderJList() {
    const container = document.getElementById('jListView');
    container.innerHTML = modules.map(m => `
      <div class="j-item" onclick="openModule('${m.id}')">
        <div class="j-icon">${m.icon}</div>
        <div class="j-info">
          <div class="j-name">${m.name}</div>
          <div class="j-desc">${m.desc}</div>
        </div>
        <div class="j-arrow">›</div>
      </div>
    `).join('');
  }

  // 渲染P人气泡
  function renderPGrid() {
    const container = document.getElementById('pGridView');
    container.innerHTML = modules.map(m => `
      <div class="p-bubble size-${m.size}" onclick="openModule('${m.id}')">
        <div class="p-icon">${m.icon}</div>
        <div class="p-name">${m.name}</div>
      </div>
    `).join('');
  }

  // 切换模式
  document.getElementById('modeToggle').addEventListener('click', function() {
    isJMode = !isJMode;
    this.textContent = isJMode ? '🔄 J人模式' : '🔄 P人模式';
    document.getElementById('jListView').style.display = isJMode ? 'flex' : 'none';
    document.getElementById('pGridView').style.display = isJMode ? 'none' : 'flex';
  });

  // 打开功能模块
  function openModule(id) {
    document.getElementById('homePage').style.display = 'none';
    document.getElementById('topBar').style.display = 'none';
    if (id === 'period') {
      document.getElementById('funcPeriod').classList.add('active');
      loadPeriodModule();
    } else if (id === 'recipe') {
      document.getElementById('funcRecipe').classList.add('active');
      loadRecipeModule();
    } else {
      alert('这个功能还在开发中~');
      goHome();
    }
  }

  // 返回主页
  function goHome() {
    document.getElementById('homePage').style.display = 'block';
    document.getElementById('topBar').style.display = 'flex';
    document.querySelectorAll('.func-page').forEach(p => p.classList.remove('active'));
  }

  // 加载周期手账（将现有代码注入）
  function loadPeriodModule() {
    // 这里之后接入你的周期手账完整代码
    document.getElementById('periodContent').innerHTML = '<div class="app-card" id="appCard">
  <h2>🌸 周期手账</h2>
  <div class="skin-row" style="display:flex;justify-content:center;gap:8px;">
    <button class="skin-btn" id="changeBgBtn" style="background:#f0e5d3;border:none;padding:8px 16px;border-radius:20px;font-size:0.8rem;font-weight:bold;cursor:pointer;">🖼 换背景</button>
    <button class="skin-btn" id="resetBgBtn" style="background:#f0e5d3;border:none;padding:8px 16px;border-radius:20px;font-size:0.8rem;font-weight:bold;cursor:pointer;">↩ 恢复默认</button>
    <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
  </div>
  <div class="month-header">
    <button class="month-nav" id="prevMonth">◀</button>
    <span id="monthLabel">2026年5月</span>
    <button class="month-nav" id="nextMonth">▶</button>
  </div>
  <div class="calendar-grid" id="calendarHead"></div>
  <div class="calendar-grid" id="calendarBody"></div>
  <div class="legend">
    <span><span class="legend-dot" style="background:#f8d7da;"></span>经期</span>
    <span><span class="legend-dot" style="background:#f0e6f6; border:1px dashed #c4a4d4;"></span>预测经期</span>
    <span><span class="legend-dot" style="background:#e0f4f0;"></span>排卵期</span>
    <span><span class="legend-dot" style="background:#c8f0e4;"></span>🌸排卵日</span>
    <span><span class="legend-dot" style="background:#fef9e7;"></span>黄体期</span>
    <span><span class="legend-dot" style="background:#fde4d0;"></span>亲密</span>
  </div>
  <div class="hint-text" id="cycleHint"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <strong id="modalDateTitle"></strong>
    <div class="toggle-row" id="periodToggle">
      <span>🩸 标记为经期</span>
      <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
    </div>
    <div class="hint-text" id="periodHint"></div>
    <div class="modal-row"><span>😣 肚子：</span><span id="painEmojis"></span></div>
    <div class="modal-row"><span>🩸 血量：</span><span id="flowEmojis"></span></div>
    <div class="modal-row">
      <span>💕 亲密：</span>
      <span id="intimacyTags">
        <span class="intimacy-tag" data-val="none">无</span>
        <span class="intimacy-tag" data-val="condom">🍥戴套</span>
        <span class="intimacy-tag" data-val="pill">💊吃药</span>
        <span class="intimacy-tag" data-val="outside">🚫体外</span>
        <span class="intimacy-tag" data-val="other">❓其他</span>
      </span>
    </div>
    <textarea id="modalNote" placeholder="备注……" rows="2" style="width:100%; border-radius:14px; border:2px solid #e3cd9e; padding:8px; resize:none; font-size:0.9rem;"></textarea>
    <div class="modal-row">
      <label style="background:#f0e5d3; padding:6px 12px; border-radius:14px; font-size:0.8rem; cursor:pointer;" for="imageUpload">📷 配图</label>
      <input type="file" id="imageUpload" accept="image/*" style="display:none;">
      <span id="imagePreview" style="font-size:0.75rem; cursor:pointer;"></span>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn btn-delete" id="modalDelete">🗑 删除</button>
      <button class="btn btn-close" id="modalClose">关闭</button>
    </div>
  </div>
</div>

<div class="image-modal" id="imageModal">
  <img id="largeImage" src="" alt="大图">
  <button class="close-img-btn" id="closeImageBtn">关闭</button>
</div>

<script>
(function(){
  const STORAGE_CYCLE = 'cycle_v5_';
  const STORAGE_SETTINGS = 'cycle_settings_v5';

  function todayStr(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(ds,n){
    const d=new Date(ds); d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function dateCompare(a,b){ return new Date(a)-new Date(b); }

  function getData(ds){
    const r=localStorage.getItem(STORAGE_CYCLE+ds);
    return r ? JSON.parse(r) : {isPeriod:false,pain:'',flow:'',intimacy:'none',note:'',image:''};
  }
  function setData(ds,obj){ localStorage.setItem(STORAGE_CYCLE+ds, JSON.stringify(obj)); }
  function delData(ds){ localStorage.removeItem(STORAGE_CYCLE+ds); }

  function getSettings(){
    const r=localStorage.getItem(STORAGE_SETTINGS);
    return r ? JSON.parse(r) : {cycleLength:28,periodLength:5,lastPeriodStart:null,lutealLength:14};
  }
  function saveSettings(s){ localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s)); }

  let calYear, calMonth;
  const now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth()+1;
  const monthLabel=document.getElementById('monthLabel');
  const calHead=document.getElementById('calendarHead');
  const calBody=document.getElementById('calendarBody');
  const cycleHint=document.getElementById('cycleHint');

  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }

  function getPredictions(year,month){
    const s=getSettings();
    const res={predicted:[],fertile:[],ovulation:[],luteal:[]};
    if(!s.lastPeriodStart) return res;
    const plen=s.periodLength||5, clen=s.cycleLength||28, llen=s.lutealLength||14;
    let ns=new Date(s.lastPeriodStart); ns.setDate(ns.getDate()-clen*3);
    for(let i=0;i<12;i++){
      ns.setDate(ns.getDate()+clen);
      const ss=`${ns.getFullYear()}-${String(ns.getMonth()+1).padStart(2,'0')}-${String(ns.getDate()).padStart(2,'0')}`;
      for(let j=0;j<plen;j++){ const pd=addDays(ss,j); const [py,pm]=pd.split('-').map(Number); if(py===year&&pm===month) res.predicted.push(parseInt(pd.split('-')[2])); }
         const allPeriodDays=[];
    for(let d=1;d<=daysInMonth(year,month);d++){ 
      const ds=`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`; 
      if(getData(ds).isPeriod) allPeriodDays.push(d); 
    }
    if(allPeriodDays.length>0){ 
      const lastRecordedDay=Math.max(...allPeriodDays); 
      res.predicted=res.predicted.filter(d=>d>lastRecordedDay); 
    }
      const ovDate=addDays(ss,-llen); const [oy,om,od]=ovDate.split('-').map(Number);
      if(oy===year&&om===month) res.ovulation.push(od);
      let fc=addDays(ovDate,-5);
      while(dateCompare(fc,ovDate)<=0){ const [fy,fm,fd]=fc.split('-').map(Number); if(fy===year&&fm===month) res.fertile.push(fd); fc=addDays(fc,1); }
      let lc=addDays(ovDate,1), le=addDays(ss,-1);
      while(dateCompare(lc,le)<=0){ const [ly,lm,ld]=lc.split('-').map(Number); if(ly===year&&lm===month) res.luteal.push(ld); lc=addDays(lc,1); }
    }
    const hasRecordThisMonth = Array.from({length: daysInMonth(year, month)}, (_, i) => i + 1).some(d => getData(`${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`).isPeriod);
  if (hasRecordThisMonth) { res.predicted = []; }
    
    return res;
  }

  function renderCalendar(){
    monthLabel.textContent=`${calYear}年${calMonth}月`;
    calHead.innerHTML=''; ['日','一','二','三','四','五','六'].forEach(d=>{ const el=document.createElement('div'); el.className='day-header'; el.textContent=d; calHead.appendChild(el); });
    const dim=daysInMonth(calYear,calMonth);
    const fd=new Date(calYear,calMonth-1,1).getDay();
    const pred=getPredictions(calYear,calMonth);
    const tt=todayStr();

    const periodSet=new Set();
    for(let d=1;d<=dim;d++){ const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`; if(getData(ds).isPeriod) periodSet.add(d); }
    const expanded=new Set(periodSet);
    const arr=[...periodSet].sort((a,b)=>a-b);
    if(arr.length>=2){ for(let i=0;i<arr.length-1;i++){ for(let d=arr[i]+1;d<arr[i+1];d++) expanded.add(d); } }

    let html='';
    for(let i=0;i<fd;i++) html+='<div></div>';
    for(let d=1;d<=dim;d++){
      const ds=`${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const data=getData(ds);
      let cls='day-cell', ovu='';
      if(expanded.has(d)) cls+=' period';
      else if(pred.ovulation.includes(d)){ cls+=' ovulation'; ovu='<span class="ovu-icon">🌸</span>'; }
      else if(pred.fertile.includes(d)) cls+=' fertile';
      else if(pred.predicted.includes(d)) cls+=' predicted';
      else if(pred.luteal.includes(d)) cls+=' luteal';
      else if(data.intimacy&&data.intimacy!=='none') cls+=' intimacy-only';
      if(ds===tt) cls+=' today';
      let extra='';
      if(data.note||data.pain||data.flow||(data.intimacy&&data.intimacy!=='none')) extra+='<div class="mini-dot"></div>';
      if(data.image) extra+=`<div class="mini-img" style="background-image:url(${data.image})"></div>`;
      if(ovu) extra+=ovu;
      html+=`<div class="${cls}" data-date="${ds}">${d}${extra}</div>`;
    }
    calBody.innerHTML=html;
    calBody.querySelectorAll('.day-cell').forEach(cell=>{
      cell.addEventListener('click', function(e){
        const ds=this.getAttribute('data-date');
        if(ds) openModal(ds);
      });
    });
  }

  // 皮肤
  const appCard=document.getElementById('appCard');
  const changeBgBtn=document.getElementById('changeBgBtn');
  const resetBgBtn=document.getElementById('resetBgBtn');
  const bgFileInput=document.getElementById('bgFileInput');
  const SKIN_KEY='my_skin_bg';
  const savedBg=localStorage.getItem(SKIN_KEY);
  if(savedBg&&appCard){ appCard.style.backgroundImage=`url(${savedBg})`; }
  changeBgBtn.addEventListener('click',()=>{ bgFileInput.click(); });
  bgFileInput.addEventListener('change',(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ const d=ev.target.result; appCard.style.backgroundImage=`url(${d})`; localStorage.setItem(SKIN_KEY,d); }; r.readAsDataURL(f); });
  resetBgBtn.addEventListener('click',()=>{ appCard.style.backgroundImage=''; localStorage.removeItem(SKIN_KEY); });

  document.getElementById('prevMonth').addEventListener('click',()=>{ calMonth--; if(calMonth<1){calMonth=12;calYear--;} renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click',()=>{ calMonth++; if(calMonth>12){calMonth=1;calYear++;} renderCalendar(); });

  // 弹窗
  const modalOverlay=document.getElementById('modalOverlay');
  const modalDateTitle=document.getElementById('modalDateTitle');
  const toggleTrack=document.getElementById('toggleTrack');
  const periodHint=document.getElementById('periodHint');
  const painEmojis=document.getElementById('painEmojis');
  const flowEmojis=document.getElementById('flowEmojis');
  const modalNote=document.getElementById('modalNote');
  const imageUpload=document.getElementById('imageUpload');
  const imagePreview=document.getElementById('imagePreview');
  const largeImage=document.getElementById('largeImage');
  const imageModal=document.getElementById('imageModal');

  let curDate=null, curImg='', curPain='', curFlow='', curIntimacy='none', curPeriod=false;
  const painOpts=['😊','😐','😖'];
  const flowOpts=['🩸','🩸🩸','🩸🩸🩸'];

  function renderPain(){
    painEmojis.innerHTML=painOpts.map(e=>`<span class="modal-emoji${curPain===e?' selected':''}" data-v="${e}">${e}</span>`).join('');
    painEmojis.querySelectorAll('.modal-emoji').forEach(el=>{ el.addEventListener('click',function(){ curPain=this.getAttribute('data-v'); renderPain(); }); });
  }
  function renderFlow(){
    flowEmojis.innerHTML=flowOpts.map(e=>`<span class="modal-emoji${curFlow===e?' selected':''}" data-v="${e}">${e}</span>`).join('');
    flowEmojis.querySelectorAll('.modal-emoji').forEach(el=>{ el.addEventListener('click',function(){ curFlow=this.getAttribute('data-v'); renderFlow(); }); });
  }
  function renderIntimacy(){
    document.querySelectorAll('#intimacyTags .intimacy-tag').forEach(tag=>{
      tag.classList.toggle('selected', tag.getAttribute('data-val')===curIntimacy);
      tag.onclick=function(){ curIntimacy=this.getAttribute('data-val'); renderIntimacy(); };
    });
  }
  function updatePeriodHint(){
    if(!curPeriod){ periodHint.textContent=''; return; }
    const prev=getData(addDays(curDate,-1)), next=getData(addDays(curDate,1));
    if(prev.isPeriod&&!next.isPeriod) periodHint.textContent='💡 可能是经期最后一天';
    else if(!prev.isPeriod&&next.isPeriod) periodHint.textContent='💡 可能是经期第一天';
    else if(prev.isPeriod&&next.isPeriod) periodHint.textContent='💡 经期中';
    else periodHint.textContent='💡 标记为经期日';
  }

  document.getElementById('periodToggle').addEventListener('click',function(){
    curPeriod=!curPeriod; toggleTrack.classList.toggle('on',curPeriod); updatePeriodHint();
  });

  function autoSaveAndClose(){
    if(!curDate) return;
    setData(curDate,{isPeriod:curPeriod,pain:curPain,flow:curFlow,intimacy:curIntimacy,note:modalNote.value.trim(),image:curImg});
    if(curPeriod){
      const s=getSettings(); let all=[];
      for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(STORAGE_CYCLE)){ const d=k.replace(STORAGE_CYCLE,''); if(getData(d).isPeriod) all.push(d); } }
      all.sort((a,b)=>dateCompare(a,b)); if(all.length>0){ s.lastPeriodStart=all[all.length-1]; saveSettings(s); }
    }
    modalOverlay.classList.remove('show');
    renderCalendar();
  }

  function openModal(ds){
    curDate=ds; modalDateTitle.textContent=ds;
    const data=getData(ds);
    curPeriod=data.isPeriod||false; toggleTrack.classList.toggle('on',curPeriod);
    curPain=data.pain||''; curFlow=data.flow||''; curIntimacy=data.intimacy||'none';
    modalNote.value=data.note||''; curImg=data.image||'';
    imagePreview.textContent=curImg?'✅ 已附图 (点我看大图)':''; imagePreview.style.cursor=curImg?'pointer':'default';
    imageUpload.value=''; updatePeriodHint();
    renderPain(); renderFlow(); renderIntimacy();
    modalOverlay.classList.add('show');
  }

  imagePreview.addEventListener('click',function(){ if(curImg){ largeImage.src=curImg; imageModal.classList.add('show'); } });
  imageUpload.addEventListener('change',function(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){ curImg=ev.target.result; imagePreview.textContent='✅ 已选图'; imagePreview.style.cursor='pointer'; }; r.readAsDataURL(f); });

  document.getElementById('modalDelete').addEventListener('click',function(){
    if(!curDate) return;
    if(confirm('确定删除这一天的记录吗？')){ delData(curDate); modalOverlay.classList.remove('show'); renderCalendar(); cycleHint.textContent='🗑 已删除'; setTimeout(()=>{cycleHint.textContent='';},1500); }
  });

  document.getElementById('modalClose').addEventListener('click',autoSaveAndClose);
  modalOverlay.addEventListener('click',function(e){ if(e.target===modalOverlay) autoSaveAndClose(); });

  document.getElementById('closeImageBtn').addEventListener('click',function(){ imageModal.classList.remove('show'); });
  imageModal.addEventListener('click',function(e){ if(e.target===imageModal) imageModal.classList.remove('show'); });

  renderCalendar();
})();

  // 加载菜谱选购
  function loadRecipeModule() {
    document.getElementById('recipeContent').innerHTML = '<div class="app-container">
  <div class="header">
    <h1>🍳 今天吃什么</h1>
  </div>

  <div class="main-area">
    <div class="category-sidebar" id="categorySidebar"></div>
    <div class="dish-list" id="dishList"></div>
  </div>

  <div class="bottom-bar">
    <span class="cart-info" id="cartInfo">已选 0 道菜</span>
    <button class="view-list-btn" id="viewListBtn">📋 采购小票</button>
  </div>
</div>

<!-- 添加/编辑菜品按钮 -->
<button class="add-dish-btn" id="addDishBtn" title="添加新菜">+</button>

<!-- 采购小票弹窗 -->
<div class="modal-overlay" id="receiptModal">
  <div class="receipt-modal">
    <h3 style="text-align:center; margin-bottom:8px;">🧾 采购清单</h3>
    <div id="receiptList"></div>
    <button class="close-receipt" id="closeReceiptBtn">关闭</button>
  </div>
</div>

<!-- 编辑菜品弹窗 -->
<div class="edit-modal" id="editModal">
  <div class="edit-box">
    <h3 id="editTitle">添加新菜</h3>
    <input type="text" id="editName" placeholder="菜名">
    <select id="editCategory">
      <option value="荤菜">荤菜</option>
      <option value="素菜">素菜</option>
      <option value="汤羹">汤羹</option>
      <option value="甜品">甜品</option>
      <option value="主食">主食</option>
      <option value="其他">其他</option>
    </select>
    <input type="text" id="editIngredients" placeholder="食材，用逗号分隔（如：番茄,鸡蛋,葱）">
    <div class="row">
      <label for="editImage" style="flex:1; background:#f0e5d3; padding:8px; border-radius:14px; text-align:center; cursor:pointer;">📷 选择图片</label>
      <input type="file" id="editImage" accept="image/*" style="display:none;">
      <span id="editImagePreview" style="font-size:0.7rem;"></span>
    </div>
    <div class="row" style="justify-content:space-between;">
      <button class="btn-primary" id="saveDishBtn">保存</button>
      <button class="btn-danger" id="deleteDishBtn" style="display:none;">删除这道菜</button>
      <button class="btn-neutral" id="cancelEditBtn">取消</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'my_menu_data';
  const STORAGE_CART = 'my_menu_cart';

  // 默认预设数据
  const defaultMenu = [
    { name: '番茄炒蛋', category: '荤菜', ingredients: ['番茄','鸡蛋','葱','盐','糖'], image: '' },
    { name: '青椒肉丝', category: '荤菜', ingredients: ['青椒','猪肉','蒜','酱油','淀粉'], image: '' },
    { name: '蒜蓉西兰花', category: '素菜', ingredients: ['西兰花','蒜','蚝油','盐'], image: '' },
    { name: '可乐鸡翅', category: '荤菜', ingredients: ['鸡翅','可乐','姜','料酒','生抽'], image: '' }
  ];

  let menuData = [];
  let selectedDishes = [];
  let currentCategory = '全部';
  let editingIndex = -1; // -1表示新增，>=0表示编辑已有

  function loadMenu() {
    const raw = localStorage.getItem(STORAGE_KEY);
    menuData = raw ? JSON.parse(raw) : defaultMenu;
    if (!raw) localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultMenu));
  }

  function saveMenu() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(menuData));
  }

  function loadCart() {
    const raw = localStorage.getItem(STORAGE_CART);
    selectedDishes = raw ? JSON.parse(raw) : [];
  }

  function saveCart() {
    localStorage.setItem(STORAGE_CART, JSON.stringify(selectedDishes));
  }

  // 获取所有分类
  function getCategories() {
    const cats = new Set(menuData.map(d => d.category));
    return ['全部', ...Array.from(cats)];
  }

  // 渲染左侧分类
  function renderCategories() {
    const sidebar = document.getElementById('categorySidebar');
    const cats = getCategories();
    sidebar.innerHTML = cats.map(c => `
      <div class="category-item${c === currentCategory ? ' active' : ''}" data-cat="${c}">${c}</div>
    `).join('');
    document.querySelectorAll('.category-item').forEach(item => {
      item.addEventListener('click', function() {
        currentCategory = this.getAttribute('data-cat');
        renderCategories();
        renderDishes();
      });
    });
  }

  // 渲染菜品列表
  function renderDishes() {
    const list = document.getElementById('dishList');
    const filtered = currentCategory === '全部' ? menuData : menuData.filter(d => d.category === currentCategory);
    list.innerHTML = filtered.map((dish, idx) => {
      const globalIndex = menuData.indexOf(dish);
      const imgStyle = dish.image ? `background-image: url('${dish.image}')` : '';
      return `
        <div class="dish-card">
          <div class="dish-img" style="${imgStyle}"></div>
          <div class="dish-info">
            <div class="dish-name">${dish.name}</div>
            <div class="dish-ingredients">
              ${dish.ingredients.map(i => `<span class="ingredient-tag">${i}</span>`).join('')}
            </div>
          </div>
          <button class="add-btn" data-index="${globalIndex}">➕</button>
        </div>
      `;
    }).join('');

    // 绑定加号
    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const index = parseInt(this.getAttribute('data-index'));
        if (!selectedDishes.includes(index)) {
          selectedDishes.push(index);
          saveCart();
          updateCartInfo();
        }
      });
    });

    // 长按卡片进入编辑
    document.querySelectorAll('.dish-card').forEach((card, i) => {
      card.addEventListener('click', function() {
        const globalIndex = menuData.indexOf(filtered[i]);
        openEditor(globalIndex);
      });
    });
  }

  function updateCartInfo() {
    document.getElementById('cartInfo').textContent = `已选 ${selectedDishes.length} 道菜`;
  }

  // 采购小票
  function renderReceipt() {
    const allIngredients = [];
    selectedDishes.forEach(index => {
      const dish = menuData[index];
      if (dish) dish.ingredients.forEach(ing => allIngredients.push(ing));
    });
    const unique = [...new Set(allIngredients)];
    document.getElementById('receiptList').innerHTML = unique.map(ing => `
      <div class="receipt-item" data-ing="${ing}">
        <div class="check-box"></div>
        <span>${ing}</span>
      </div>
    `).join('');
    document.querySelectorAll('.receipt-item').forEach(item => {
      item.addEventListener('click', function() { this.classList.toggle('checked'); });
    });
  }

  // 编辑弹窗
  let tempImageData = '';

  function openEditor(index) {
    editingIndex = index;
    const dish = index >= 0 ? menuData[index] : null;
    document.getElementById('editTitle').textContent = index >= 0 ? '编辑菜品' : '添加新菜';
    document.getElementById('editName').value = dish ? dish.name : '';
    document.getElementById('editCategory').value = dish ? dish.category : '荤菜';
    document.getElementById('editIngredients').value = dish ? dish.ingredients.join(',') : '';
    document.getElementById('editImagePreview').textContent = dish && dish.image ? '✅ 已有图' : '';
    tempImageData = dish ? dish.image || '' : '';
    document.getElementById('deleteDishBtn').style.display = index >= 0 ? 'inline-block' : 'none';
    document.getElementById('editModal').classList.add('show');
  }

  document.getElementById('addDishBtn').addEventListener('click', () => openEditor(-1));

  document.getElementById('editImage').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      tempImageData = ev.target.result;
      document.getElementById('editImagePreview').textContent = '✅ 已选图';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('saveDishBtn').addEventListener('click', function() {
    const name = document.getElementById('editName').value.trim();
    const category = document.getElementById('editCategory').value;
    const ingredientsRaw = document.getElementById('editIngredients').value.trim();
    if (!name || !ingredientsRaw) return alert('菜名和食材不能为空');
    const ingredients = ingredientsRaw.split(/[,，]/).map(s => s.trim()).filter(s => s);
    const dish = { name, category, ingredients, image: tempImageData };

    if (editingIndex >= 0) {
      menuData[editingIndex] = dish;
    } else {
      menuData.push(dish);
    }
    saveMenu();
    document.getElementById('editModal').classList.remove('show');
    renderCategories();
    renderDishes();
  });

  document.getElementById('deleteDishBtn').addEventListener('click', function() {
    if (editingIndex >= 0 && confirm('确定删除这道菜吗？')) {
      menuData.splice(editingIndex, 1);
      selectedDishes = selectedDishes.filter(i => i !== editingIndex).map(i => i > editingIndex ? i - 1 : i);
      saveMenu();
      saveCart();
      document.getElementById('editModal').classList.remove('show');
      renderCategories();
      renderDishes();
      updateCartInfo();
    }
  });

  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('show');
  });

  // 小票弹窗
  document.getElementById('viewListBtn').addEventListener('click', () => {
    renderReceipt();
    document.getElementById('receiptModal').classList.add('show');
  });
  document.getElementById('closeReceiptBtn').addEventListener('click', () => {
    document.getElementById('receiptModal').classList.remove('show');
  });
  document.getElementById('receiptModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  // 初始化
  loadMenu();
  loadCart();
  renderCategories();
  renderDishes();
  updateCartInfo();
';
  }

  // 初始化
  renderJList();
  renderPGrid();
</script>
